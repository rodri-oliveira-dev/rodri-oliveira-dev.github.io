# CodeRabbit - Personal Portfolio
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "pt-BR"

tone_instructions: >-
  Seja objetivo, técnico e construtivo.
  Priorize problemas comprováveis e regressões.
  Evite comentários cosméticos, especulações
  e sugestões já cobertas pelo CI.

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  review_details: false
  poem: false
  sequence_diagrams: false

  high_level_summary_instructions: >-
    Resuma mudanças funcionais, impacto visual,
    SEO, acessibilidade, idiomas e riscos.
    Não invente resultados de testes.

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true

  path_filters:
    - "!**/*.{png,jpg,jpeg,gif,webp,ico,woff,woff2}"
    - "!google03f812d1021f07e7.html"
    - "!BingSiteAuth.xml"
    - "!1e7dfc65bd806e29edef5985f15cdb79.txt"

  path_instructions:
    - path: "**/*.html"
      instructions: |
        Verifique HTML semântico e acessibilidade.
        Confira title, description, canonical,
        hreflang, Open Graph e dados estruturados.
        Verifique coerência entre URLs e conteúdo.
        Sinalize regressões reais, não preferências.

    - path: "**/case-studies/**/*.html"
      instructions: |
        Verifique precisão técnica e coerência
        entre problema, abordagem e resultados.
        Não aceite métricas ou resultados sem
        evidência no repositório.
        Não invente responsabilidades, clientes
        ou tecnologias utilizadas.

    - path: "**/index.html"
      instructions: |
        Verifique clareza da apresentação profissional.
        Preserve informações factuais e terminologia.
        Evite marketing exagerado, frases artificiais,
        superlativos e afirmações sem evidência.
        Verifique navegação, links e chamadas à ação.

    - path: "{en,es,pt-br}/**/*.html"
      instructions: |
        Verifique linguagem natural do idioma.
        Compare fatos, cargos, datas e projetos
        entre as versões disponíveis.
        Não exija tradução literal.
        Preserve significado e localização.
        Verifique lang, hreflang e links internos.

    - path: "assets/css/**"
      instructions: |
        Priorize responsividade e acessibilidade.
        Verifique telas pequenas, overflow,
        contraste, estados de foco e zoom.
        Sinalize regressões de layout comprováveis.
        Preserve progressive enhancement.

    - path: "assets/js/**"
      instructions: |
        Verifique erros de execução, manipulação
        segura do DOM e tratamento de eventos.
        Avalie navegação por teclado e acessibilidade.
        Evite dependências e trabalho desnecessários.
        Priorize compatibilidade e performance.

    - path: "assets/data/**"
      instructions: |
        Estes dados alimentam conteúdo sincronizado.
        Verifique estrutura, URLs e campos esperados.
        Sinalize alterações incompatíveis.
        Evite recomendar edição manual de dados
        gerados quando a origem for uma automação.

    - path: ".github/scripts/**"
      instructions: |
        Verifique segurança de entradas externas,
        tratamento de erros e idempotência.
        Avalie determinismo e integridade
        dos arquivos gerados.
        Evite sugestões já cobertas por testes.

    - path: ".github/workflows/**"
      instructions: |
        Verifique permissões mínimas do GITHUB_TOKEN,
        uso seguro de secrets e scripts externos.
        Avalie riscos de supply chain e deploy.
        Confira integridade da publicação.
        Priorize falhas que afetem o site.

    - path: "**/*.md"
      instructions: |
        Verifique links e precisão das informações.
        Preserve linguagem natural e profissional.
        Não reescreva textos apenas por estilo.
        Compare versões traduzidas quando aplicável.

    - path: "sitemap.xml"
      instructions: |
        Verifique URLs públicas, duplicidade,
        consistência e páginas removidas.

    - path: "robots.txt"
      instructions: |
        Verifique bloqueios acidentais de indexação
        e consistência com o sitemap.

chat:
  auto_reply: true
