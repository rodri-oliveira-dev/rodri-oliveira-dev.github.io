<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc">
  <title id="title">Flujo de entrega de ReliableWebhooks</title>
  <desc id="desc">Una aplicación coloca un webhook en un store de entregas. Un dispatcher lo reclama con un lease, envía un intento mediante un transporte y registra éxito, reintento, falla permanente o dead letter. La telemetría observa el flujo.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1">
      <stop stop-color="#111a2d"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0l8 4-8 4z" fill="#7dd3fc"/>
    </marker>
  </defs>
  <rect width="1120" height="430" rx="24" fill="#070b14"/>
  <g font-family="system-ui,Segoe UI,sans-serif">
    <g fill="url(#panel)" stroke="#334155">
      <rect x="32" y="76" width="165" height="112" rx="16"/>
      <rect x="232" y="76" width="190" height="112" rx="16"/>
      <rect x="457" y="76" width="190" height="112" rx="16"/>
      <rect x="682" y="76" width="190" height="112" rx="16"/>
      <rect x="907" y="76" width="181" height="112" rx="16"/>
    </g>
    <g fill="#edf2ff" font-size="17" font-weight="700" text-anchor="middle">
      <text x="114" y="122">Aplicación</text>
      <text x="327" y="114">Enqueue +</text><text x="327" y="138">store de entregas</text>
      <text x="552" y="114">Dispatcher +</text><text x="552" y="138">lease</text>
      <text x="777" y="114">Transporte</text><text x="777" y="138">un intento HTTP</text>
      <text x="997" y="122">Receptor</text>
    </g>
    <g fill="#9aa8c1" font-size="12" text-anchor="middle">
      <text x="114" y="158">ID estable del webhook</text>
      <text x="327" y="164">estado + próximo intento</text>
      <text x="552" y="164">concurrencia limitada</text>
      <text x="777" y="164">HTTPS + HMAC opcional</text>
      <text x="997" y="158">debe ser idempotente</text>
    </g>
    <g stroke="#7dd3fc" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M197 132h27"/><path d="M422 132h27"/><path d="M647 132h27"/><path d="M872 132h27"/>
    </g>
    <path d="M777 188v44H327v-36" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="552" y="222" fill="#c4b5fd" font-size="12" text-anchor="middle">persistir la transición o programar el reintento</text>
    <g font-size="14" font-weight="700" text-anchor="middle">
      <rect x="92" y="282" width="180" height="64" rx="14" fill="#10261f" stroke="#34d399"/><text x="182" y="319" fill="#a7f3d0">Completado</text>
      <rect x="286" y="282" width="180" height="64" rx="14" fill="#172033" stroke="#7dd3fc"/><text x="376" y="319" fill="#bae6fd">Reintento programado</text>
      <rect x="480" y="282" width="180" height="64" rx="14" fill="#2a171b" stroke="#fb7185"/><text x="570" y="319" fill="#fecdd3">Falla permanente</text>
      <rect x="674" y="282" width="180" height="64" rx="14" fill="#2a2311" stroke="#fbbf24"/><text x="764" y="319" fill="#fde68a">Dead letter</text>
      <rect x="868" y="282" width="160" height="64" rx="14" fill="#171c2d" stroke="#a78bfa"/><text x="948" y="310" fill="#ddd6fe">Logs, traces</text><text x="948" y="329" fill="#ddd6fe">y métricas</text>
    </g>
    <text x="560" y="390" fill="#9aa8c1" font-size="13" text-anchor="middle">La durabilidad proviene del store de la aplicación; el protocolo no ofrece entrega exactly-once.</text>
  </g>
</svg>
