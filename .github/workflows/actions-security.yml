name: GitHub Actions security

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: actions-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Audit GitHub Actions security for annotations
        continue-on-error: true
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          inputs: .
          collect: default
          online-audits: true
          persona: regular
          min-severity: medium
          min-confidence: medium
          config: zizmor.yml
          advanced-security: false
          annotations: true

      - name: Generate authoritative zizmor report with retry
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail

          mkdir -p .zizmor
          max_attempts=3
          scan_status=2
          final_report=".zizmor/report.json"
          : > "$final_report"

          for attempt in $(seq 1 "$max_attempts"); do
            attempt_report=".zizmor/report-${attempt}.json"
            attempt_stderr=".zizmor/stderr-${attempt}.log"

            echo "zizmor authoritative scan attempt ${attempt}/${max_attempts}."

            set +e
            docker run \
              --rm \
              --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
              --workdir /workspace \
              --env GH_TOKEN \
              ghcr.io/zizmorcore/zizmor:1.30.1@sha256:a2eb396d886c053073405c7a980f2139ba2248ec172243cfa3841e57196e8101 \
              --format=json-v1 \
              --persona=regular \
              --collect=default \
              --min-severity=medium \
              --min-confidence=medium \
              --color=never \
              --config=zizmor.yml \
              -- . > "$attempt_report" 2> "$attempt_stderr"
            scan_status=$?
            set -e

            cat "$attempt_stderr" >&2 || true
            cp "$attempt_report" "$final_report"

            if jq -e 'type == "array"' "$attempt_report" > /dev/null 2>&1; then
              finding_count="$(jq 'length' "$attempt_report")"

              if [[ "$finding_count" -gt 0 ]]; then
                echo "zizmor produced ${finding_count} blocking finding(s); not retrying a valid security result."
                break
              fi

              if [[ "$scan_status" -eq 0 ]]; then
                echo "zizmor scan completed successfully on attempt ${attempt}."
                break
              fi
            fi

            if [[ "$attempt" -lt "$max_attempts" ]]; then
              delay=$((attempt * 5))
              echo "zizmor did not produce a successful, valid report (exit ${scan_status}); retrying in ${delay}s."
              sleep "$delay"
            fi
          done

          echo "$scan_status" > .zizmor/exit-code

      - name: Summarize zizmor security results
        if: always()
        run: node .github/scripts/summarize-zizmor.mjs

      - name: Publish zizmor report on PR
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          report=".zizmor/pr-comment.md"
          if [[ ! -f "$report" ]]; then
            echo "zizmor PR report was not generated."
            exit 0
          fi

          comment_id="$(
            gh api --paginate "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" \
              --jq '.[] | select(.body | startswith("<!-- zizmor-security-report -->")) | .id' \
              | head -n 1
          )"

          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/${GH_REPO}/issues/comments/${comment_id}" \
              -F "body=@${report}" > /dev/null
          else
            gh api --method POST "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" \
              -F "body=@${report}" > /dev/null
          fi

      - name: Enforce zizmor security gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          report=".zizmor/report.json"
          exit_code_file=".zizmor/exit-code"

          if [[ ! -s "$report" || ! -f "$exit_code_file" ]]; then
            echo "zizmor security gate failed: authoritative scan artifacts are missing."
            exit 1
          fi

          if ! jq -e 'type == "array"' "$report" > /dev/null; then
            echo "zizmor security gate failed: authoritative report is not valid JSON output."
            exit 1
          fi

          findings="$(jq 'length' "$report")"
          scan_status="$(cat "$exit_code_file")"

          if [[ "$findings" -gt 0 ]]; then
            echo "zizmor security gate failed: ${findings} blocking finding(s) detected."
            exit 1
          fi

          if [[ "$scan_status" -ne 0 ]]; then
            echo "zizmor security gate failed: scanner remained operationally unhealthy after retries (exit ${scan_status})."
            exit 1
          fi

          echo "zizmor security gate passed using the authoritative report."
