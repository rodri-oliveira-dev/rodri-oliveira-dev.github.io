name: GitHub Actions security

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: actions-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Audit GitHub Actions security
        id: zizmor
        continue-on-error: true
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          inputs: .
          collect: default
          online-audits: true
          persona: regular
          min-severity: medium
          min-confidence: medium
          config: zizmor.yml
          advanced-security: false
          annotations: true

      - name: Generate machine-readable zizmor report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .zizmor
          set +e
          docker run \
            --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            --workdir /workspace \
            --env GH_TOKEN \
            ghcr.io/zizmorcore/zizmor:1.30.1@sha256:a2eb396d886c053073405c7a980f2139ba2248ec172243cfa3841e57196e8101 \
            --format=json-v1 \
            --persona=regular \
            --collect=default \
            --min-severity=medium \
            --min-confidence=medium \
            --color=never \
            --config=zizmor.yml \
            -- . > .zizmor/report.json
          status=$?
          set -e
          echo "$status" > .zizmor/exit-code

      - name: Summarize zizmor security results
        if: always()
        run: node .github/scripts/summarize-zizmor.mjs

      - name: Publish zizmor report on PR
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          report=".zizmor/pr-comment.md"
          if [[ ! -f "$report" ]]; then
            echo "zizmor PR report was not generated."
            exit 0
          fi

          comment_id="$(
            gh api --paginate "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" \
              --jq '.[] | select(.body | startswith("<!-- zizmor-security-report -->")) | .id' \
              | head -n 1
          )"

          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/${GH_REPO}/issues/comments/${comment_id}" \
              -F "body=@${report}" > /dev/null
          else
            gh api --method POST "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" \
              -F "body=@${report}" > /dev/null
          fi

      - name: Enforce zizmor security gate
        if: always()
        env:
          ZIZMOR_OUTCOME: ${{ steps.zizmor.outcome }}
        run: |
          if [[ "$ZIZMOR_OUTCOME" != "success" ]]; then
            echo "zizmor security gate failed."
            exit 1
          fi
