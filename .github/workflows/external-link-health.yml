name: External link health

on:
  schedule:
    - cron: "23 10 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/external-link-health.yml"

permissions:
  contents: read

concurrency:
  group: external-link-health-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  link-health:
    name: External link health
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --root-dir "$(pwd)"
            --verbose
            --no-progress
            --timeout 20
            --max-retries 2
            --exclude 'https://(www\.)?linkedin\.com/'
            --exclude 'https://medium\.com/'
            './index.html'
            './en/index.html'
            './pt-br/index.html'
            './README.md'
          format: markdown
          output: .lychee/external-link-health.md
          jobSummary: true
          failIfEmpty: true
          fail: true
          token: ${{ secrets.GITHUB_TOKEN }}
