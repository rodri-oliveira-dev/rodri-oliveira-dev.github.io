name: Adjust mobile vCard visibility

on:
  push:
    branches:
      - feat/mobile
    paths:
      - .github/workflows/adjust-mobile-vcard-visibility.yml

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feat/mobile
        uses: actions/checkout@v4
        with:
          ref: feat/mobile
          fetch-depth: 0

      - name: Restrict vCard CTA to mobile
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          from pathlib import Path

          for path in (Path('index.html'), Path('en/index.html')):
              text = path.read_text(encoding='utf-8')
              old = 'class="button secondary" href="/assets/contact/rodrigo-de-oliveira.vcf"'
              new = 'class="button secondary mobile-contact-action" href="/assets/contact/rodrigo-de-oliveira.vcf"'
              if old not in text and new not in text:
                  raise SystemExit(f'vCard CTA not found in {path}')
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')

          css_path = Path('assets/css/site.css')
          css = css_path.read_text(encoding='utf-8')

          base_rule = '''\n.mobile-contact-action {\n  display: none;\n}\n'''
          if '.mobile-contact-action {' not in css:
              marker = '.button.secondary {\n  border: 1px solid var(--line-strong);\n  background: rgba(255,255,255,.025);\n}\n'
              if marker not in css:
                  raise SystemExit('button secondary CSS marker not found')
              css = css.replace(marker, marker + base_rule, 1)

          mobile_rule = '  .mobile-contact-action { display: inline-flex; }\n\n'
          media_marker = '@media (max-width: 640px) {\n'
          if mobile_rule not in css:
              if media_marker not in css:
                  raise SystemExit('640px media query not found')
              css = css.replace(media_marker, media_marker + mobile_rule, 1)

          css_path.write_text(css, encoding='utf-8')
          PY

          git rm .github/workflows/adjust-mobile-vcard-visibility.yml

      - name: Commit mobile-only vCard action
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "fix: show vCard action only on mobile"
          git push origin HEAD:feat/mobile
