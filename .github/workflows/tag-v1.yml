name: Create release tag

on:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: create-release-tag
  cancel-in-progress: false

jobs:
  tag:
    name: Tag validated main merge
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_REPO: ${{ github.repository }}
      TARGET_SHA: ${{ github.sha }}

    steps:
      - name: Resolve merged pull request
        id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          pull_requests="$(gh api "repos/${GH_REPO}/commits/${TARGET_SHA}/pulls")"
          pr_number="$(
            jq -r '
              [.[] | select(.merged_at != null)]
              | sort_by(.merged_at)
              | last
              | .number // empty
            ' <<< "$pull_requests"
          )"

          if [[ -z "$pr_number" ]]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "Commit ${TARGET_SHA} is not associated with a merged pull request; skipping release tagging."
            exit 0
          fi

          {
            echo "eligible=true"
            echo "pr_number=${pr_number}"
          } >> "$GITHUB_OUTPUT"
          echo "Commit ${TARGET_SHA} is associated with merged PR #${pr_number}."

      - name: Determine next semantic version
        id: version
        if: steps.scope.outputs.eligible == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.scope.outputs.pr_number }}
        run: |
          set -euo pipefail

          tag_rows="$(
            gh api --paginate "repos/${GH_REPO}/tags?per_page=100" \
              --jq '.[] | [.name, .commit.sha] | @tsv'
          )"

          existing_for_sha="$(
            awk -v sha="$TARGET_SHA" \
              '$2 == sha && $1 ~ /^[0-9]+\.[0-9]+\.[0-9]+$/ { print $1 }' \
              <<< "$tag_rows" \
              | sort -V \
              | tail -n 1
          )"

          if [[ -n "$existing_for_sha" ]]; then
            {
              echo "already_tagged=true"
              echo "tag_name=${existing_for_sha}"
            } >> "$GITHUB_OUTPUT"
            echo "Commit ${TARGET_SHA} is already tagged as ${existing_for_sha}; nothing to do."
            exit 0
          fi

          latest_tag="$(
            awk '$1 ~ /^[0-9]+\.[0-9]+\.[0-9]+$/ { print $1 }' <<< "$tag_rows" \
              | sort -V \
              | tail -n 1
          )"
          latest_tag="${latest_tag:-0.0.0}"

          labels="$(
            gh api "repos/${GH_REPO}/issues/${PR_NUMBER}" \
              --jq '.labels[].name' \
              | tr '[:upper:]' '[:lower:]'
          )"

          bump="patch"

          if grep -Eq '^(release:major|semver:major|major|breaking|breaking-change)$' <<< "$labels"; then
            bump="major"
          elif grep -Eq '^(release:minor|semver:minor|minor|enhancement|feature)$' <<< "$labels"; then
            bump="minor"
          elif grep -Eq '^(release:patch|semver:patch|patch|bug|fix)$' <<< "$labels"; then
            bump="patch"
          fi

          IFS='.' read -r major minor patch <<< "$latest_tag"

          case "$bump" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
          esac

          tag_name="${major}.${minor}.${patch}"

          {
            echo "already_tagged=false"
            echo "bump=${bump}"
            echo "previous_tag=${latest_tag}"
            echo "tag_name=${tag_name}"
          } >> "$GITHUB_OUTPUT"

          echo "Version decision for PR #${PR_NUMBER}: ${latest_tag} -> ${tag_name} (${bump})."

      - name: Wait for all required main workflows
        if: steps.scope.outputs.eligible == 'true' && steps.version.outputs.already_tagged != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          required=(
            "Site validation"
            "Accessibility"
            "Lighthouse CI"
            "GitHub Actions security"
            "SEO validation"
            "Notify IndexNow"
          )

          for attempt in {1..90}; do
            echo "Validation poll ${attempt}/90 for ${TARGET_SHA}."

            runs="$(
              gh run list \
                --repo "$GH_REPO" \
                --commit "$TARGET_SHA" \
                --event push \
                --limit 100 \
                --json databaseId,name,status,conclusion,url
            )"

            missing=0
            pending=0

            for workflow in "${required[@]}"; do
              row="$(
                jq -c --arg workflow "$workflow" \
                  '[.[] | select(.name == $workflow)] | sort_by(.databaseId) | last // empty' \
                  <<< "$runs"
              )"

              if [[ -z "$row" ]]; then
                echo "Waiting for workflow to start: ${workflow}"
                missing=1
                continue
              fi

              status="$(jq -r '.status' <<< "$row")"
              conclusion="$(jq -r '.conclusion // ""' <<< "$row")"
              url="$(jq -r '.url' <<< "$row")"

              if [[ "$status" != "completed" ]]; then
                echo "Waiting for ${workflow}: ${status} (${url})"
                pending=1
                continue
              fi

              if [[ "$conclusion" != "success" ]]; then
                echo "Required workflow failed: ${workflow} concluded ${conclusion} (${url})"
                exit 1
              fi

              echo "Passed: ${workflow} (${url})"
            done

            if [[ "$missing" -eq 0 && "$pending" -eq 0 ]]; then
              echo "All required workflows completed successfully for ${TARGET_SHA}."
              exit 0
            fi

            sleep 10
          done

          echo "Timed out waiting for required workflows on ${TARGET_SHA}."
          exit 1

      - name: Create annotated release tag
        if: steps.scope.outputs.eligible == 'true' && steps.version.outputs.already_tagged != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.scope.outputs.pr_number }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
          BUMP: ${{ steps.version.outputs.bump }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          set -euo pipefail

          if ref_json="$(gh api "repos/${GH_REPO}/git/ref/tags/${TAG_NAME}" 2>/dev/null)"; then
            ref_sha="$(jq -r '.object.sha' <<< "$ref_json")"
            ref_type="$(jq -r '.object.type' <<< "$ref_json")"

            if [[ "$ref_type" == "tag" ]]; then
              tagged_sha="$(gh api "repos/${GH_REPO}/git/tags/${ref_sha}" --jq '.object.sha')"
            else
              tagged_sha="$ref_sha"
            fi

            if [[ "$tagged_sha" == "$TARGET_SHA" ]]; then
              echo "Tag ${TAG_NAME} already points to ${TARGET_SHA}; nothing to do."
              exit 0
            fi

            echo "Tag ${TAG_NAME} already exists and points to ${tagged_sha}, not ${TARGET_SHA}."
            exit 1
          fi

          pr_title="$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" --jq '.title')"
          tag_message="Release ${TAG_NAME} after PR #${PR_NUMBER}: ${pr_title}"

          tag_object_sha="$(
            gh api \
              --method POST \
              "repos/${GH_REPO}/git/tags" \
              -f tag="$TAG_NAME" \
              -f message="$tag_message" \
              -f object="$TARGET_SHA" \
              -f type="commit" \
              --jq '.sha'
          )"

          gh api \
            --method POST \
            "repos/${GH_REPO}/git/refs" \
            -f ref="refs/tags/${TAG_NAME}" \
            -f sha="$tag_object_sha" \
            > /dev/null

          {
            echo "# Release tag"
            echo
            echo "- **Tag:** \`${TAG_NAME}\`"
            echo "- **Commit:** \`${TARGET_SHA}\`"
            echo "- **Origem:** PR #${PR_NUMBER}"
            echo "- **Bump:** \`${BUMP}\` (anterior: \`${PREVIOUS_TAG}\`)"
            echo "- **Resultado:** todos os workflows obrigatórios em \`main\` concluíram com sucesso antes da criação da tag"
          } >> "$GITHUB_STEP_SUMMARY"
