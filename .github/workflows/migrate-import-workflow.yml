name: Migrate newsletter import workflow

on:
  push:
    branches:
      - feat/align-site-architecture-positioning
    paths:
      - ".github/workflows/migrate-import-workflow.yml"

permissions:
  contents: read

jobs:
  migrate:
    name: Migrate import workflow
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feat/align-site-architecture-positioning
          persist-credentials: false

      - name: Apply migration
        run: python3 .github/scripts/migrate-import-workflow.py

      - name: Validate diff
        run: git diff --check

      - name: Export migrated workflow
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: migrated-import-workflow
          path: .github/workflows/import-newsletter-article.yml
          if-no-files-found: error
          retention-days: 1
