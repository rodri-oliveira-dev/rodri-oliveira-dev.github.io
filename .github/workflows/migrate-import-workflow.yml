name: Migrate newsletter import workflow

on:
  push:
    branches:
      - feat/align-site-architecture-positioning
    paths:
      - ".github/workflows/migrate-import-workflow.yml"

permissions:
  contents: write

jobs:
  migrate:
    name: Migrate import workflow
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feat/align-site-architecture-positioning
          persist-credentials: false

      - name: Apply migration
        run: python3 .github/scripts/migrate-import-workflow.py

      - name: Validate diff
        run: git diff --check

      - name: Stage migrated workflow outside protected workflow path
        run: |
          mkdir -p .migration
          cp .github/workflows/import-newsletter-article.yml .migration/import-newsletter-article.yml

      - name: Commit staged workflow blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .migration/import-newsletter-article.yml
          git commit -m "chore: stage migrated newsletter workflow blob"
          git push origin HEAD:feat/align-site-architecture-positioning
