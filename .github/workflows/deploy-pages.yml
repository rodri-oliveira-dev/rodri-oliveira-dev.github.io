name: Publish site with resume PDF

on:
  pull_request:
    paths:
      - 'curriculo/**'
      - 'servicos/**'
      - 'en/services/**'
      - 'es/servicios/**'
      - 'assets/css/servicos.css'
      - '.github/scripts/generate-resume-pdf.mjs'
      - '.github/workflows/deploy-pages.yml'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Generate PDF and build static site
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install pinned PDF renderer
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.65.0
          npx --no-install playwright install --with-deps chromium

      - name: Generate resume PDF
        run: node .github/scripts/generate-resume-pdf.mjs

      - name: Assemble site
        run: |
          mkdir -p _site
          rsync -a --exclude='/.git/' --exclude='/.github/' --exclude='/node_modules/' --exclude='/_site/' --exclude='*.log' ./ _site/
          test -s _site/curriculo/rodrigo-de-oliveira.pdf
          test -f _site/curriculo/index.html
          test -f _site/index.html
          # Keep all client-side WebMCP modules in the GitHub Pages artifact.
          # Missing modules would break the dependency chain after publish.
          test -f _site/assets/js/webmcp.js
          test -f _site/assets/js/webmcp-tools.mjs
          test -f _site/assets/js/webmcp-data.mjs
          test -f _site/assets/js/webmcp-i18n.mjs
          test -f _site/docs/webmcp.pt-BR.md
          test -f _site/docs/webmcp.en.md
          test -f _site/docs/webmcp.es-419.md
          test -f _site/es/index.html
          # Ensure all three localized service pages and their stylesheet are deployed.
          test -f _site/servicos/index.html
          test -f _site/en/services/index.html
          test -f _site/es/servicios/index.html
          test -f _site/assets/css/servicos.css

      - name: Upload PDF preview for review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: curriculo-pdf-preview
          path: curriculo/rodrigo-de-oliveira.pdf
          if-no-files-found: error

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
