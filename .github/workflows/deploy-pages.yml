name: Publish site with resume PDF

on:
  pull_request:
    paths:
      - 'curriculo/**'
      - 'en/resume/**'
      - 'es/curriculo/**'
      - 'servicos/**'
      - 'en/services/**'
      - 'es/servicios/**'
      - 'assets/css/servicos.css'
      - 'assets/js/webmcp.js'
      - 'assets/js/webmcp-services.mjs'
      - 'assets/js/webmcp-services-data.mjs'
      - '.github/scripts/generate-resume-pdf.mjs'
      - '.github/workflows/deploy-pages.yml'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Generate PDF and build static site
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install pinned PDF renderer
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.65.0
          npx --no-install playwright install --with-deps chromium

      - name: Generate localized resume PDFs
        run: node .github/scripts/generate-resume-pdf.mjs

      - name: Check localized resume PDF content, reading order, and pagination
        run: |
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends poppler-utils
          fi
          python3 .github/scripts/test_resume_pdf_order.py

      - name: Assemble site
        run: |
          mkdir -p _site
          rsync -a --exclude='/.git/' --exclude='/.github/' --exclude='/.sonarcloud.properties' --exclude='/docs/sonarcloud-integration.md' --exclude='/node_modules/' --exclude='/_site/' --exclude='*.log' ./ _site/
          test ! -e _site/.sonarcloud.properties
          test ! -e _site/docs/sonarcloud-integration.md
          test -s _site/curriculo/rodrigo-de-oliveira.pdf
          test -s _site/en/resume/rodrigo-de-oliveira.pdf
          test -s _site/es/curriculo/rodrigo-de-oliveira.pdf
          test -f _site/curriculo/index.html
          test -f _site/en/resume/index.html
          test -f _site/es/curriculo/index.html
          test -f _site/index.html
          # PWA shell and localized fallbacks must be published at origin scope.
          test -f _site/sw.js
          test -f _site/assets/js/pwa-register.js
          test -f _site/assets/css/offline.css
          test -f _site/offline.html
          test -f _site/en/offline.html
          test -f _site/es/offline.html
          # Keep all client-side WebMCP modules in the GitHub Pages artifact.
          # Missing modules would break the dependency chain after publish.
          test -f _site/assets/js/webmcp.js
          test -f _site/assets/js/webmcp-tools.mjs
          test -f _site/assets/js/webmcp-data.mjs
          test -f _site/assets/js/webmcp-i18n.mjs
          test -f _site/assets/js/webmcp-services.mjs
          test -f _site/assets/js/webmcp-services-data.mjs
          test -f _site/docs/webmcp.pt-BR.md
          test -f _site/docs/webmcp.en.md
          test -f _site/docs/webmcp.es-419.md
          test -f _site/es/index.html
          # Ensure all three localized service pages and their stylesheet are deployed.
          test -f _site/servicos/index.html
          test -f _site/en/services/index.html
          test -f _site/es/servicios/index.html
          test -f _site/assets/css/servicos.css

      - name: Upload localized PDF previews for review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: localized-resume-pdf-previews
          path: |
            curriculo/rodrigo-de-oliveira.pdf
            en/resume/rodrigo-de-oliveira.pdf
            es/curriculo/rodrigo-de-oliveira.pdf
          if-no-files-found: error

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
