name: Lighthouse CI

on:
  pull_request:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse quality
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select pages and run count
        id: plan
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/select-lighthouse-pages.cjs --event "$GITHUB_EVENT_NAME" --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: No website changes (success)
        if: ${{ steps.plan.outputs.run == 'false' }}
        env:
          PLAN_REASON: ${{ steps.plan.outputs.reason }}
        run: |
          message="$PLAN_REASON. Required Lighthouse quality check passed without a scan."
          echo "$message"
          printf '## Lighthouse CI\n\n%s\n' "$message" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node.js
        if: ${{ steps.plan.outputs.run == 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Lighthouse CI
        if: ${{ steps.plan.outputs.run == 'true' }}
        run: npm install --ignore-scripts --no-save --package-lock=false @lhci/cli@0.15.1

      - name: Prepare local Lighthouse fixture
        if: ${{ steps.plan.outputs.run == 'true' }}
        env:
          LHCI_PAGE_FILES: ${{ steps.plan.outputs.page_files }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          for (const file of JSON.parse(process.env.LHCI_PAGE_FILES)) {
            let content = fs.readFileSync(file, "utf8");
            content = content.replace("; upgrade-insecure-requests", "");
            content = content.replace("connect-src 'none'; ", "");
            fs.writeFileSync(file, content, "utf8");
          }
          NODE

      - name: Start local site
        if: ${{ steps.plan.outputs.run == 'true' }}
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/portfolio-http.log 2>&1 &
          echo $! > /tmp/portfolio-http.pid

          for _ in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/portfolio-http.log
          exit 1

      - name: Collect Lighthouse reports
        id: collect
        if: ${{ steps.plan.outputs.run == 'true' }}
        continue-on-error: true
        env:
          LHCI_URLS: ${{ steps.plan.outputs.urls }}
          LHCI_NUMBER_OF_RUNS: ${{ steps.plan.outputs.runs }}
        run: npx --no-install lhci collect --config=lighthouserc.cjs

      - name: Summarize Lighthouse results
        id: summarize
        if: ${{ steps.plan.outputs.run == 'true' && steps.collect.outcome == 'success' }}
        continue-on-error: true
        env:
          LHCI_URLS: ${{ steps.plan.outputs.urls }}
          LHCI_NUMBER_OF_RUNS: ${{ steps.plan.outputs.runs }}
        run: node .github/scripts/summarize-lighthouse.mjs

      - name: Assert Lighthouse budgets
        id: assert
        if: ${{ steps.plan.outputs.run == 'true' && steps.collect.outcome == 'success' }}
        continue-on-error: true
        env:
          LHCI_URLS: ${{ steps.plan.outputs.urls }}
          LHCI_NUMBER_OF_RUNS: ${{ steps.plan.outputs.runs }}
        run: npx --no-install lhci assert --config=lighthouserc.cjs

      - name: Upload Lighthouse reports
        if: ${{ always() && steps.plan.outputs.run == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-${{ github.event_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .lighthouseci/*.json
            .lighthouseci/*.html
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Publish Lighthouse report on PR
        if: ${{ always() && steps.plan.outputs.run == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          report=".lighthouseci/pr-comment.md"
          if [[ ! -f "$report" ]]; then
            echo "Lighthouse PR report was not generated."
            exit 0
          fi

          comment_id="$(
            gh api --paginate "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" \
              --jq '.[] | select(.body | startswith("<!-- lighthouse-ci-report -->")) | .id' \
              | head -n 1
          )"

          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/${GH_REPO}/issues/comments/${comment_id}" \
              -F "body=@${report}" > /dev/null
          else
            gh api --method POST "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" \
              -F "body=@${report}" > /dev/null
          fi

      - name: Stop local site
        if: ${{ always() && steps.plan.outputs.run == 'true' }}
        run: |
          if [[ -f /tmp/portfolio-http.pid ]]; then
            kill "$(cat /tmp/portfolio-http.pid)" 2>/dev/null || true
          fi

      - name: Enforce Lighthouse result
        if: ${{ always() && steps.plan.outputs.run == 'true' }}
        env:
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          SUMMARIZE_OUTCOME: ${{ steps.summarize.outcome }}
          ASSERT_OUTCOME: ${{ steps.assert.outcome }}
        run: |
          if [[ "$COLLECT_OUTCOME" != "success" || "$SUMMARIZE_OUTCOME" != "success" || "$ASSERT_OUTCOME" != "success" ]]; then
            echo "Lighthouse failed: collect=$COLLECT_OUTCOME summarize=$SUMMARIZE_OUTCOME assert=$ASSERT_OUTCOME"
            exit 1
          fi
