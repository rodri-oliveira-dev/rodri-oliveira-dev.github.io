name: Notify IndexNow

on:
  workflow_call:

permissions:
  contents: read

jobs:
  notify:
    name: Submit published public URLs
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    timeout-minutes: 10
    env:
      SITE_HOST: rodri-oliveira-dev.github.io
      SITE_URL: https://rodri-oliveira-dev.github.io
      INDEXNOW_KEY: 1e7dfc65bd806e29edef5985f15cdb79

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Build IndexNow payload
        id: payload
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          site_url = os.environ["SITE_URL"].rstrip("/")
          key = os.environ["INDEXNOW_KEY"]

          def sitemap_urls() -> set[str]:
              sitemap = Path("sitemap.xml")
              if not sitemap.exists():
                  return set()

              root = ET.fromstring(sitemap.read_text(encoding="utf-8"))
              namespace = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
              return {
                  loc.text.strip()
                  for loc in root.findall("sm:url/sm:loc", namespace)
                  if loc.text and loc.text.strip()
              }

          # The caller has successfully deployed this exact commit. Submit its full sitemap.
          urls = sitemap_urls()
          urls.add(f"{site_url}/newsletter/feed.xml")

          payload = {
              "host": os.environ["SITE_HOST"],
              "key": key,
              "keyLocation": f"{site_url}/{key}.txt",
              "urlList": sorted(urls),
          }
          Path("/tmp/indexnow.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"count={len(urls)}\n")

          print(f"Prepared {len(urls)} URL(s) for IndexNow.")
          for url in sorted(urls):
              print(f"- {url}")
          PY

      - name: Wait for public ownership key
        if: steps.payload.outputs.count != '0'
        shell: bash
        run: |
          key_url="${SITE_URL}/${INDEXNOW_KEY}.txt"
          for attempt in {1..18}; do
            body="$(curl --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 10 "$key_url" || true)"
            if [[ "$body" == "$INDEXNOW_KEY" || "$body" == "$INDEXNOW_KEY"$'\n' ]]; then
              echo "IndexNow ownership key is publicly available."
              exit 0
            fi
            echo "Ownership key not available yet (attempt ${attempt}/18)."
            sleep 10
          done

          echo "IndexNow ownership key was not available after the deployment window."
          exit 1

      - name: Submit URLs to IndexNow
        if: steps.payload.outputs.count != '0'
        shell: bash
        run: |
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request POST \
            --header 'Content-Type: application/json; charset=utf-8' \
            --data-binary @/tmp/indexnow.json \
            https://api.indexnow.org/indexnow

      - name: Write summary
        if: always()
        shell: bash
        env:
          URL_COUNT: ${{ steps.payload.outputs.count }}
        run: |
          {
            echo "# IndexNow"
            echo
            echo "- **URLs submetidas:** ${URL_COUNT:-0}"
            echo "- **Host:** \`${SITE_HOST}\`"
            echo "- **Endpoint:** \`https://api.indexnow.org/indexnow\`"
          } >> "$GITHUB_STEP_SUMMARY"
