name: Import newsletter article

on:
  workflow_dispatch:
    inputs:
      article_url:
        description: "URL do artigo (LinkedIn ou outra página pública)"
        required: true
        type: string
      fallback_title:
        description: "Título manual (opcional; usado apenas se a recuperação automática falhar)"
        required: false
        type: string
      fallback_description:
        description: "Descrição manual (opcional; usada apenas se a recuperação automática falhar)"
        required: false
        type: string
      fallback_published_at:
        description: "Data manual YYYY-MM-DD (opcional; usada apenas se a recuperação automática falhar)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: import-newsletter-article
  cancel-in-progress: false

env:
  AUTOMATION_BRANCH_PREFIX: automation/import-newsletter-article
  WORKSPACE_ARTIFACT: newsletter-import-workspace

jobs:
  import_metadata:
    name: Import article metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false

      - name: Recover metadata and update JSON
        id: metadata
        env:
          ARTICLE_URL: ${{ inputs.article_url }}
          FALLBACK_TITLE: ${{ inputs.fallback_title }}
          FALLBACK_DESCRIPTION: ${{ inputs.fallback_description }}
          FALLBACK_PUBLISHED_AT: ${{ inputs.fallback_published_at }}
        run: python3 .github/scripts/import-newsletter.py

      - name: Upload imported catalog
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.WORKSPACE_ARTIFACT }}-catalog
          path: assets/data/newsletter-articles.json
          if-no-files-found: error
          retention-days: 1

  render_validate:
    name: Render and validate homepage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: import_metadata
    outputs:
      article_count: ${{ steps.validation.outputs.article_count }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false

      - name: Download imported catalog
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ env.WORKSPACE_ARTIFACT }}-catalog
          path: assets/data

      - name: Render homepage with imported article
        run: python3 .github/scripts/render-newsletter.py

      - name: Validate generated content
        id: validation
        shell: bash
        run: |
          article_count="$(python3 - <<'PY'
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          start = html.index("<!-- NEWSLETTER_ARTICLES:START -->")
          end = html.index("<!-- NEWSLETTER_ARTICLES:END -->", start)
          block = html[start:end]

          count = block.count("<article>")
          if count < 1 or count > 4:
              raise SystemExit(f"Quantidade inesperada de artigos renderizados: {count}")

          if block.count('target="_blank"') != count:
              raise SystemExit("Nem todos os artigos possuem link externo esperado.")

          print(count)
          PY
          )"

          echo "article_count=${article_count}" >> "$GITHUB_OUTPUT"
          echo "Validated ${article_count} newsletter article(s)."
          git diff --check

          if [[ -z "$(git status --porcelain -- assets/data/newsletter-articles.json index.html)" ]]; then
            echo "Import completed without repository changes."
            exit 1
          fi

      - name: Upload rendered workspace
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.WORKSPACE_ARTIFACT }}
          path: |
            assets/data/newsletter-articles.json
            index.html
          if-no-files-found: error
          retention-days: 1

  publish_pr:
    name: Publish automation Pull Request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: render_validate
    permissions:
      contents: write
      pull-requests: write
    outputs:
      branch: ${{ steps.pull_request.outputs.branch }}
      number: ${{ steps.pull_request.outputs.number }}
      url: ${{ steps.pull_request.outputs.url }}
      automation_token_configured: ${{ steps.pull_request.outputs.automation_token_configured }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Download rendered workspace
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ env.WORKSPACE_ARTIFACT }}
          path: .

      - name: Publish automation branch and open or update PR
        id: pull_request
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PR_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          AUTOMATION_TOKEN_CONFIGURED: ${{ secrets.AUTOMATION_PR_TOKEN != '' }}
        run: |
          automation_branch="${AUTOMATION_BRANCH_PREFIX}-${GITHUB_RUN_ID}"
          gh auth setup-git

          remote_sha="$(
            git ls-remote --heads origin "refs/heads/${automation_branch}" \
              | awk '{print $1}'
          )"

          git switch -c "$automation_branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/newsletter-articles.json index.html
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "Import completed without repository changes."
            exit 1
          fi

          git commit -m "content: import newsletter article"

          if [[ -n "$remote_sha" ]]; then
            git push \
              --force-with-lease="refs/heads/${automation_branch}:${remote_sha}" \
              origin "HEAD:refs/heads/${automation_branch}"
          else
            git push --set-upstream origin "HEAD:refs/heads/${automation_branch}"
          fi

          cat > /tmp/newsletter-import-pr.md <<EOF
          ## Resumo

          Importa metadados de um artigo para o catálogo da newsletter e atualiza a homepage com o estado resultante.

          ## Pipeline

          - metadados importados e normalizados em um job dedicado;
          - homepage renderizada e validada em um segundo job;
          - branch e Pull Request publicados somente após as validações locais passarem;
          - quality gates executados automaticamente;
          - Pull Request mesclado automaticamente somente quando todos os gates concluírem com sucesso.

          ## Validação

          - duplicidade de URL verificada;
          - catálogo limitado e ordenado pelo workflow de importação;
          - homepage renderizada por \`.github/scripts/render-newsletter.py\`;
          - bloco da newsletter validado;
          - \`git diff --check\` executado;
          - Site validation, Accessibility, Lighthouse CI e GitHub Actions security executados antes do merge;
          - merge automático bloqueado se qualquer quality gate falhar.

          ## Origem

          Gerado por [Import newsletter article](https://github.com/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}).

          > O JSON e a homepage são revisados no mesmo PR. Se algum quality gate falhar, o PR permanece aberto para inspeção; caso todos passem, o merge é automático.
          EOF

          pr_number="$(
            gh pr list \
              --repo "$GH_REPO" \
              --head "$automation_branch" \
              --base main \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" \
              --repo "$GH_REPO" \
              --title "content: import newsletter article" \
              --body-file /tmp/newsletter-import-pr.md
            pr_url="$(gh pr view "$pr_number" --repo "$GH_REPO" --json url --jq '.url')"
          else
            pr_url="$(
              gh pr create \
                --repo "$GH_REPO" \
                --base main \
                --head "$automation_branch" \
                --title "content: import newsletter article" \
                --body-file /tmp/newsletter-import-pr.md
            )"
            pr_number="$(gh pr view "$pr_url" --repo "$GH_REPO" --json number --jq '.number')"
          fi

          {
            echo "branch=${automation_branch}"
            echo "number=${pr_number}"
            echo "url=${pr_url}"
            echo "automation_token_configured=${AUTOMATION_TOKEN_CONFIGURED}"
          } >> "$GITHUB_OUTPUT"

      - name: Add Pull Request result to summary
        if: always()
        shell: bash
        env:
          ARTICLE_COUNT: ${{ needs.render_validate.outputs.article_count }}
          PR_BRANCH: ${{ steps.pull_request.outputs.branch }}
          PR_NUMBER: ${{ steps.pull_request.outputs.number }}
          PR_URL: ${{ steps.pull_request.outputs.url }}
          AUTOMATION_TOKEN_CONFIGURED: ${{ steps.pull_request.outputs.automation_token_configured }}
        run: |
          {
            echo "# Newsletter import pipeline"
            echo
            echo "- **Artigos renderizados na homepage:** ${ARTICLE_COUNT:-n/a}"

            if [[ -n "$PR_URL" ]]; then
              echo "- **Branch:** \`${PR_BRANCH}\`"
              echo "- **Pull Request:** [#${PR_NUMBER}](${PR_URL})"

              if [[ "$AUTOMATION_TOKEN_CONFIGURED" == "true" ]]; then
                echo "- **Token de automação dedicado:** configurado"
              else
                echo "- **Token de automação dedicado:** não configurado"
              fi
            else
              echo "- **Pull Request:** não criado"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  quality_gates:
    name: Run quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: publish_pr
    permissions:
      actions: write
      checks: read
      contents: read
      pull-requests: read

    steps:
      - name: Run repository quality gates
        id: quality
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.publish_pr.outputs.number }}
          PR_BRANCH: ${{ needs.publish_pr.outputs.branch }}
          AUTOMATION_TOKEN_CONFIGURED: ${{ needs.publish_pr.outputs.automation_token_configured }}
        run: |
          set -euo pipefail

          if [[ -z "$PR_NUMBER" || -z "$PR_BRANCH" ]]; then
            echo "Pull Request metadata is missing."
            exit 1
          fi

          if [[ "$AUTOMATION_TOKEN_CONFIGURED" == "true" ]]; then
            echo "Dedicated automation token detected; waiting for native pull_request checks."

            checks_found=0
            for _ in {1..30}; do
              checks_found="$(
                gh pr checks "$PR_NUMBER" \
                  --repo "$GH_REPO" \
                  --json name \
                  --jq 'length' 2>/dev/null || echo 0
              )"

              if [[ "$checks_found" -gt 0 ]]; then
                break
              fi

              sleep 2
            done

            if [[ "$checks_found" -eq 0 ]]; then
              echo "No pull_request checks were detected for PR #${PR_NUMBER}."
              exit 1
            fi

            gh pr checks "$PR_NUMBER" \
              --repo "$GH_REPO" \
              --watch \
              --fail-fast

            echo "mode=native" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Using GITHUB_TOKEN; dispatching quality workflows explicitly."
          workflows=(
            "site-validation.yml"
            "accessibility.yml"
            "lighthouse.yml"
            "actions-security.yml"
          )

          declare -A run_ids

          for workflow in "${workflows[@]}"; do
            echo "Dispatching ${workflow} on ${PR_BRANCH}..."
            gh workflow run "$workflow" \
              --repo "$GH_REPO" \
              --ref "$PR_BRANCH"
          done

          for workflow in "${workflows[@]}"; do
            run_id=""

            for _ in {1..30}; do
              run_id="$(
                gh run list \
                  --repo "$GH_REPO" \
                  --workflow "$workflow" \
                  --branch "$PR_BRANCH" \
                  --event workflow_dispatch \
                  --limit 1 \
                  --json databaseId \
                  --jq '.[0].databaseId // empty'
              )"

              if [[ -n "$run_id" ]]; then
                break
              fi

              sleep 2
            done

            if [[ -z "$run_id" ]]; then
              echo "Could not locate dispatched run for ${workflow}."
              exit 1
            fi

            run_ids["$workflow"]="$run_id"
          done

          for workflow in "${workflows[@]}"; do
            run_id="${run_ids[$workflow]}"
            echo "Waiting for ${workflow} (run ${run_id})..."
            gh run watch "$run_id" \
              --repo "$GH_REPO" \
              --exit-status
          done

          {
            echo "# Newsletter quality gates"
            echo
            echo "PR #${PR_NUMBER} passed all explicitly dispatched quality gates:"
            echo
            for workflow in "${workflows[@]}"; do
              run_id="${run_ids[$workflow]}"
              echo "- **${workflow}:** [run ${run_id}](https://github.com/${GH_REPO}/actions/runs/${run_id})"
            done
          } >> "$GITHUB_STEP_SUMMARY"

          echo "mode=dispatched" >> "$GITHUB_OUTPUT"

  merge_pr:
    name: Merge automation Pull Request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - publish_pr
      - quality_gates
    permissions:
      contents: write
      pull-requests: write
    outputs:
      merge_sha: ${{ steps.merge.outputs.merge_sha }}

    steps:
      - name: Merge Pull Request after quality gates
        id: merge
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PR_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.publish_pr.outputs.number }}
          PR_URL: ${{ needs.publish_pr.outputs.url }}
        run: |
          set -euo pipefail

          gh pr merge "$PR_NUMBER" \
            --repo "$GH_REPO" \
            --squash \
            --delete-branch

          merge_sha="$(
            gh pr view "$PR_NUMBER" \
              --repo "$GH_REPO" \
              --json mergeCommit \
              --jq '.mergeCommit.oid'
          )"

          if [[ -z "$merge_sha" || "$merge_sha" == "null" ]]; then
            echo "Pull Request was merged, but merge commit SHA could not be determined."
            exit 1
          fi

          echo "merge_sha=${merge_sha}" >> "$GITHUB_OUTPUT"

          {
            echo "# Newsletter import completed"
            echo
            echo "- **Pull Request:** [#${PR_NUMBER}](${PR_URL})"
            echo "- **Merge commit:** \`${merge_sha}\`"
            echo "- **Result:** quality gates passed and PR merged automatically"
          } >> "$GITHUB_STEP_SUMMARY"

  rebuild_pages:
    name: Trigger GitHub Pages build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - publish_pr
      - merge_pr
    if: ${{ needs.publish_pr.outputs.automation_token_configured != 'true' }}
    permissions:
      contents: read
      pages: write

    steps:
      - name: Request Pages build for merged content
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api \
            --method POST \
            "repos/${GH_REPO}/pages/builds" \
            > /dev/null

          echo "GitHub Pages build requested for the latest revision on main."
