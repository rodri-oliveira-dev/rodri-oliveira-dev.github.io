name: Site validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-validation:
    name: Site validation
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Test DEV Community synchronization boundaries
        run: python3 -m unittest discover -s .github/scripts -p 'test_sync_devto_articles.py'

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Test language resolution and navigation labels
        run: node .github/scripts/test-site-i18n.cjs

      - name: Install validation tooling
        run: npm install --no-save --ignore-scripts html-validate@11.15.0 @cspell/dict-pt-br@2.4.2 @cspell/dict-es-es@3.0.9

      - name: Validate HTML
        shell: bash
        run: |
          pages=(index.html en/index.html pt-br/index.html)
          [[ -f es/index.html ]] && pages+=(es/index.html)
          mapfile -t case_studies < <(find case-studies en/case-studies es/case-studies -mindepth 2 -maxdepth 2 -name index.html -print 2>/dev/null | sort)
          npx --no-install html-validate "${pages[@]}" "${case_studies[@]}"

      - name: Validate links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --root-dir "$(pwd)"
            --verbose
            --no-progress
            --timeout 10
            --max-retries 1
            --exclude 'https://(www\.)?linkedin\.com/'
            --exclude 'https://medium\.com/'
            --exclude '^https://rodri-oliveira-dev\.github\.io/(en/)?case-studies/[^/]+/?$'
            './index.html'
            './en/index.html'
            './pt-br/index.html'
            './case-studies/**/*.html'
            './en/case-studies/**/*.html'
            './es/**/*.html'
            './README.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check spelling
        uses: streetsidesoftware/cspell-action@ce1816e4ce36532956ac6e983737392774b6e169 # v9.2.0
        with:
          config: .cspell.json
          files: |
            index.html
            en/index.html
            case-studies/**/*.html
            en/case-studies/**/*.html
            es/**/*.html
            README.md
          incremental_files_only: false
          strict: true
          suggestions: true
          inline: error
          report: all

      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
