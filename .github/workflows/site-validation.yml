name: Site validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product-tests:
    name: Product JavaScript tests and coverage
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Run product tests and generate LCOV
        run: bash .github/scripts/product-coverage.sh

      - name: Publish LCOV for the same workflow run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: product-lcov-${{ github.run_attempt }}
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  site-validation:
    name: Site validation
    needs: product-tests
    if: ${{ !cancelled() }}
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Require product tests and coverage
        env:
          PRODUCT_TESTS_RESULT: ${{ needs.product-tests.result }}
        run: test "$PRODUCT_TESTS_RESULT" = success

      - name: Test external article synchronization boundaries
        run: python3 -m unittest discover -s .github/scripts -p 'test_sync_*articles.py'

      - name: Test newsletter metadata import
        run: python3 -m unittest discover -s .github/scripts -p 'test_import_newsletter.py'

      - name: Test newsletter quality gate monitor
        run: python3 -m unittest discover -s .github/scripts -p 'test_wait_newsletter_checks.py'

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Test Sonar finding synchronization offline
        run: node --test .github/scripts/test-sonar-quality-sync.cjs

      - name: Test incremental Lighthouse page selection
        run: node --test .github/scripts/test-select-lighthouse-pages.mjs

      - name: Install validation tooling
        run: npm install --no-save --ignore-scripts html-validate@11.15.0 @cspell/dict-pt-br@2.4.2 @cspell/dict-es-es@3.0.9

      - name: Validate HTML
        shell: bash
        run: |
          pages=(index.html en/index.html es/index.html pt-br/index.html curriculo/index.html en/resume/index.html es/curriculo/index.html servicos/index.html en/services/index.html es/servicios/index.html)
          mapfile -t case_studies < <(find case-studies en/case-studies es/case-studies -mindepth 2 -maxdepth 2 -name index.html -print | sort)
          npx --no-install html-validate "${pages[@]}" "${case_studies[@]}"

      # Keep the general link gate strict; GitHub file links are handled
      # separately because GitHub may return intermittent 503s to CI crawlers.
      # Localized resume routes are checked as source files before publication;
      # generated PDFs are validated by deploy-pages.yml and are not versioned.
      - name: Validate links (excluding GitHub)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --config .github/lychee-pr.toml
            --root-dir "$(pwd)"
            --verbose
            --no-progress
            --timeout 30
            --max-retries 3
            --retry-wait-time 2
            --max-concurrency 12
            --host-concurrency 2
            --exclude '^https://github\.com/'
            --exclude 'https://(www\.)?linkedin\.com/'
            --exclude 'https://medium\.com/'
            --exclude '^https://rodri-oliveira-dev\.github\.io/es/?$'
            --exclude '^https://rodri-oliveira-dev\.github\.io/(?:(?:en|es)/)?case-studies/[^/]+/?$'
            --exclude '^https://rodri-oliveira-dev\.github\.io/(?:servicos|en/services|es/servicios)/?'
            --exclude '^https://rodri-oliveira-dev\.github\.io/(?:curriculo|en/resume|es/curriculo)/?$'
            --exclude 'rodrigo-de-oliveira\.pdf$'
            './index.html'
            './en/index.html'
            './pt-br/index.html'
            './curriculo/index.html'
            './en/resume/index.html'
            './es/curriculo/index.html'
            './servicos/index.html'
            './en/services/index.html'
            './es/servicios/index.html'
            './case-studies/**/*.html'
            './en/case-studies/**/*.html'
            './es/**/*.html'
            './README.md'
            './README.en.md'
            './README.es.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Lychee's --include overrides --exclude. Only GitHub URLs are
      # reconsidered here; 404/410 still fail, while GitHub 503 is tolerated.
      # Scheduled External link health continues to report all 503s strictly.
      - name: Validate GitHub links (tolerate 503)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --config .github/lychee-pr.toml
            --root-dir "$(pwd)"
            --verbose
            --no-progress
            --timeout 30
            --max-retries 3
            --retry-wait-time 2
            --max-concurrency 3
            --host-concurrency 1
            --accept '200..=299,503'
            --exclude '^https?://'
            --include '^https://github\.com/'
            './index.html'
            './en/index.html'
            './es/index.html'
            './pt-br/index.html'
            './servicos/index.html'
            './en/services/index.html'
            './es/servicios/index.html'
            './case-studies/**/*.html'
            './en/case-studies/**/*.html'
            './es/case-studies/**/*.html'
            './README.md'
            './README.en.md'
            './README.es.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check spelling
        uses: streetsidesoftware/cspell-action@ce1816e4ce36532956ac6e983737392774b6e169 # v9.2.0
        with:
          config: .cspell.json
          files: |
            index.html
            curriculo/index.html
            en/resume/index.html
            es/curriculo/index.html
            servicos/**/*.html
            en/services/**/*.html
            en/index.html
            case-studies/**/*.html
            en/case-studies/**/*.html
            es/**/*.html
            README.md
            README.en.md
            README.es.md
          incremental_files_only: false
          strict: true
          suggestions: true
          inline: error
          report: all

      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  sonar:
    name: SonarQube Cloud
    needs: product-tests
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.base_ref == 'main') }}
    uses: ./.github/workflows/sonar.yml
    permissions:
      contents: read
      pull-requests: write
    with:
      product_tests_result: ${{ needs.product-tests.result }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
