name: Site validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-validation:
    name: Site validation
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Test external article synchronization boundaries
        run: python3 -m unittest discover -s .github/scripts -p 'test_sync_*articles.py'

      - name: Test newsletter metadata import
        run: python3 -m unittest discover -s .github/scripts -p 'test_import_newsletter.py'

      - name: Test newsletter quality gate monitor
        run: python3 -m unittest discover -s .github/scripts -p 'test_wait_newsletter_checks.py'

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Test language resolution and navigation labels
        run: node .github/scripts/test-site-i18n.cjs

      - name: Install validation tooling
        run: npm install --no-save --ignore-scripts html-validate@11.15.0 @cspell/dict-pt-br@2.4.2 @cspell/dict-es-es@3.0.9

      - name: Validate HTML
        shell: bash
        run: |
          pages=(index.html en/index.html es/index.html pt-br/index.html curriculo/index.html)
          mapfile -t case_studies < <(find case-studies en/case-studies es/case-studies -mindepth 2 -maxdepth 2 -name index.html -print | sort)
          npx --no-install html-validate "${pages[@]}" "${case_studies[@]}"

      # Keep the general link gate strict; GitHub file links are handled
      # separately because GitHub may return intermittent 503s to CI crawlers.
      - name: Validate links (excluding GitHub)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --config .github/lychee-pr.toml
            --root-dir "$(pwd)"
            --verbose
            --no-progress
            --timeout 30
            --max-retries 3
            --retry-wait-time 2
            --max-concurrency 12
            --host-concurrency 2
            --exclude '^https://github\\.com/'
            --exclude 'https://(www\\.)?linkedin\\.com/'
            --exclude 'https://medium\\.com/'
            --exclude '^https://rodri-oliveira-dev\\.github\\.io/es/?$'
            --exclude '^https://rodri-oliveira-dev\\.github\\.io/(?:(?:en|es)/)?case-studies/[^/]+/?$'
            './index.html'
            './en/index.html'
            './pt-br/index.html'
            './case-studies/**/*.html'
            './en/case-studies/**/*.html'
            './es/**/*.html'
            './README.md'
            './README.en.md'
            './README.es.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Lychee's --include overrides --exclude. Only GitHub URLs are
      # reconsidered here; 404/410 still fail, while GitHub 503 is tolerated.
      # Scheduled External link health continues to report all 503s strictly.
      - name: Validate GitHub links (tolerate 503)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --config .github/lychee-pr.toml
            --root-dir "$(pwd)"
            --verbose
            --no-progress
            --timeout 30
            --max-retries 3
            --retry-wait-time 2
            --max-concurrency 3
            --host-concurrency 1
            --accept '200..=299,503'
            --exclude '^https?://'
            --include '^https://github\\.com/'
            './index.html'
            './en/index.html'
            './pt-br/index.html'
            './case-studies/**/*.html'
            './en/case-studies/**/*.html'
            './es/**/*.html'
            './README.md'
            './README.en.md'
            './README.es.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check spelling
        uses: streetsidesoftware/cspell-action@ce1816e4ce36532956ac6e983737392774b6e169 # v9.2.0
        with:
          config: .cspell.json
          files: |
            index.html
            curriculo/index.html
            en/index.html
            case-studies/**/*.html
            en/case-studies/**/*.html
            es/**/*.html
            README.md
            README.en.md
            README.es.md
          incremental_files_only: false
          strict: true
          suggestions: true
          inline: error
          report: all

      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
