name: Bootstrap vCard link

on:
  push:
    branches:
      - feat/mobile
    paths:
      - .github/workflows/bootstrap-vcard-link.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feat/mobile
        uses: actions/checkout@v4
        with:
          ref: feat/mobile
          fetch-depth: 0

      - name: Add vCard actions
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          replacements = {
              Path('index.html'): (
                  '            <a class="button secondary" href="mailto:rodrigodotnet@outlook.com">Vamos conversar ↗</a>',
                  '            <a class="button secondary" href="mailto:rodrigodotnet@outlook.com">Vamos conversar ↗</a>\n'
                  '            <a class="button secondary" href="/assets/contact/rodrigo-de-oliveira.vcf" download>Salvar contato ↓</a>'
              ),
              Path('en/index.html'): (
                  '            <a class="button secondary" href="mailto:rodrigodotnet@outlook.com">Let\'s talk ↗</a>',
                  '            <a class="button secondary" href="mailto:rodrigodotnet@outlook.com">Let\'s talk ↗</a>\n'
                  '            <a class="button secondary" href="/assets/contact/rodrigo-de-oliveira.vcf" download>Save contact ↓</a>'
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              if '/assets/contact/rodrigo-de-oliveira.vcf' in text:
                  continue
              if old not in text:
                  raise SystemExit(f'expected hero action not found in {path}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          git rm .github/workflows/bootstrap-vcard-link.yml

      - name: Commit vCard link
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: add save contact action"
          git push origin HEAD:feat/mobile
