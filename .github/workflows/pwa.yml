name: PWA cross-browser

on:
  pull_request:
    paths:
      - '**/*.html'
      - 'sw.js'
      - 'site.webmanifest'
      - 'assets/**'
      - '.github/scripts/test-pwa*.cjs'
      - '.github/scripts/test-pwa-web-push.mjs'
      - '.github/scripts/fixtures/web-push-manual.*'
      - '.github/scripts/serve-test-site.py'
      - '.github/workflows/pwa.yml'
  push:
    branches:
      - main
    paths:
      - '**/*.html'
      - 'sw.js'
      - 'site.webmanifest'
      - 'assets/**'
      - '.github/scripts/test-pwa*.cjs'
      - '.github/scripts/test-pwa-web-push.mjs'
      - '.github/scripts/fixtures/web-push-manual.*'
      - '.github/scripts/serve-test-site.py'
      - '.github/workflows/pwa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pwa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browsers:
    name: Offline scenarios (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      PWA_BROWSER: ${{ matrix.browser }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check PWA unit and source contracts
        run: node --test .github/scripts/test-pwa.cjs .github/scripts/test-pwa-web-push.mjs

      - name: Install pinned browser test runner
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.65.0
          npx --no-install playwright install --with-deps "$PWA_BROWSER"

      - name: Prepare local HTTP fixture
        run: |
          # Production CSP upgrades insecure requests; localhost is a trusted SW origin.
          python3 - <<'PY'
          from pathlib import Path
          for path in Path(".").glob("**/index.html"):
              if "node_modules" in path.parts:
                  continue
              html = path.read_text(encoding="utf-8")
              if "; upgrade-insecure-requests" in html:
                  path.write_text(html.replace("; upgrade-insecure-requests", ""), encoding="utf-8")
          PY

      - name: Start local static server
        run: |
          python3 .github/scripts/serve-test-site.py --port 8765 --bind 127.0.0.1 --directory . >/tmp/pwa-http.log 2>&1 &
          echo $! >/tmp/pwa-http.pid
          for _ in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8765/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pwa-http.log
          exit 1

      - name: Verify installation, visited pages, offline fallback and reconnect
        run: node .github/scripts/test-pwa-browser.cjs

      - name: Stop server
        if: always()
        run: |
          if [[ -f /tmp/pwa-http.pid ]]; then
            kill "$(cat /tmp/pwa-http.pid)" 2>/dev/null || true
          fi
