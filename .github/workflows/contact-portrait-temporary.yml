name: Convert public contact portrait (temporary)
on:
  push:
    branches: [fix/vcard-ios-compatibility]
    paths: ['.github/workflows/contact-portrait-temporary.yml']
permissions:
  contents: read
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Convert existing public portrait to JPEG
        shell: bash
        run: |
          set -euo pipefail
          if ! python3 -c 'import PIL' 2>/dev/null; then
            python3 -m venv "$RUNNER_TEMP/portrait-env"
            source "$RUNNER_TEMP/portrait-env/bin/activate"
            python -m pip install --disable-pip-version-check 'Pillow==12.2.0'
          fi
          python3 - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          import os
          with Image.open("assets/profile/rodrigo-about.webp") as image:
              result = ImageOps.fit(ImageOps.exif_transpose(image).convert("RGB"), (400, 400), Image.Resampling.LANCZOS)
              result.save(Path(os.environ["RUNNER_TEMP"]) / "contact.jpg", "JPEG", quality=85, optimize=True, progressive=False)
          PY
          base64 -w 512 "$RUNNER_TEMP/contact.jpg" | sed 's/^/CONTACT_JPEG:/'
