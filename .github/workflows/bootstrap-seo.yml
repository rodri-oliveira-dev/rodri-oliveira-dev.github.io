name: Bootstrap SEO improvements

on:
  push:
    branches:
      - feat/seo-discovery-indexnow
    paths:
      - .github/workflows/bootstrap-seo.yml

permissions:
  contents: write

jobs:
  apply:
    name: Generate SEO artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feat/seo-discovery-indexnow
          fetch-depth: 0

      - name: Synchronize HTML and sitemap
        run: python3 .github/scripts/sync-seo.py

      - name: Validate generated artifacts
        shell: bash
        run: |
          python3 -m py_compile .github/scripts/sync-seo.py
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          ET.parse("sitemap.xml")
          for page in ("index.html", "en/index.html"):
              html = Path(page).read_text(encoding="utf-8")
              if 'type="application/rss+xml"' not in html:
                  raise SystemExit(f"RSS autodiscovery missing in {page}")
              if '"@type": "WebSite"' not in html:
                  raise SystemExit(f"WebSite structured data missing in {page}")
          PY
          git diff --check

      - name: Commit generated HTML and sitemap
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html en/index.html sitemap.xml

          if git diff --cached --quiet; then
            echo "SEO artifacts already synchronized."
            exit 0
          fi

          git commit -m "feat: synchronize SEO metadata"
          git push origin HEAD:feat/seo-discovery-indexnow
