name: Bootstrap Android mobile metadata

on:
  push:
    branches:
      - feat/mobile
    paths:
      - .github/workflows/bootstrap-android-mobile.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feat/mobile
        uses: actions/checkout@v4
        with:
          ref: feat/mobile
          fetch-depth: 0

      - name: Generate Android assets and manifest
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --quiet cairosvg pillow

          mkdir -p assets/brand

          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/rodri-oliveira-dev/rodri-oliveira-dev/feat/mobile/assets/brand/ro-architect-mark.svg" \
            --output /tmp/ro-architect-mark.svg

          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/rodri-oliveira-dev/rodri-oliveira-dev/feat/mobile/assets/brand/maskable-icon.png" \
            --output assets/brand/maskable-icon.png

          python <<'PY'
          from pathlib import Path
          import cairosvg

          source = Path('/tmp/ro-architect-mark.svg').read_bytes()
          for size in (192, 512):
              cairosvg.svg2png(
                  bytestring=source,
                  write_to=f'assets/brand/android-icon-{size}x{size}.png',
                  output_width=size,
                  output_height=size,
                  background_color='#070b14',
              )
          PY

          cat > site.webmanifest <<'JSON'
          {
            "id": "/",
            "name": "Rodrigo de Oliveira",
            "short_name": "Rodrigo",
            "start_url": "/",
            "scope": "/",
            "display": "standalone",
            "background_color": "#070b14",
            "theme_color": "#070b14",
            "icons": [
              {
                "src": "/assets/brand/android-icon-192x192.png",
                "sizes": "192x192",
                "type": "image/png",
                "purpose": "any"
              },
              {
                "src": "/assets/brand/android-icon-512x512.png",
                "sizes": "512x512",
                "type": "image/png",
                "purpose": "any"
              },
              {
                "src": "/assets/brand/maskable-icon.png",
                "sizes": "512x512",
                "type": "image/png",
                "purpose": "maskable"
              }
            ]
          }
          JSON

          python <<'PY'
          from pathlib import Path

          manifest_link = '  <link rel="manifest" href="/site.webmanifest">'

          for path in (Path('index.html'), Path('en/index.html')):
              text = path.read_text(encoding='utf-8')
              if manifest_link not in text:
                  marker = '  <link rel="icon" type="image/svg+xml" href="/favicon.svg">'
                  if marker not in text:
                      raise SystemExit(f'favicon marker not found in {path}')
                  text = text.replace(marker, marker + '\n' + manifest_link, 1)
                  path.write_text(text, encoding='utf-8')
          PY

          git rm .github/workflows/bootstrap-android-mobile.yml

      - name: Commit Android mobile support
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/brand/android-icon-192x192.png \
                  assets/brand/android-icon-512x512.png \
                  assets/brand/maskable-icon.png \
                  site.webmanifest \
                  index.html \
                  en/index.html \
                  .github/workflows/bootstrap-android-mobile.yml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "feat: add Android web app metadata"
          git push origin HEAD:feat/mobile
