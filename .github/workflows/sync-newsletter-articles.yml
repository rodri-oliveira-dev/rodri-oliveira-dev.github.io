name: Sync newsletter articles

on:
  workflow_dispatch:
  schedule:
    # 09:00 America/Sao_Paulo (UTC-3)
    - cron: "0 12 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-newsletter-articles
  cancel-in-progress: false

jobs:
  sync:
    name: Render latest newsletter articles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AUTOMATION_BRANCH: automation/sync-newsletter-articles

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Render four latest articles
        run: python3 .github/scripts/render-newsletter.py

      - name: Validate generated block
        id: validation
        shell: bash
        run: |
          article_count="$(python3 - <<'PY'
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          start = html.index("<!-- NEWSLETTER_ARTICLES:START -->")
          end = html.index("<!-- NEWSLETTER_ARTICLES:END -->", start)
          block = html[start:end]

          count = block.count("<article>")
          if count < 1 or count > 4:
              raise SystemExit(f"Quantidade inesperada de artigos renderizados: {count}")

          if block.count('target="_blank"') != count:
              raise SystemExit("Nem todos os artigos possuem link externo esperado.")

          print(count)
          PY
          )"

          echo "article_count=${article_count}" >> "$GITHUB_OUTPUT"
          echo "Validated ${article_count} newsletter article(s)."
          git diff --check

      - name: Detect homepage changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Homepage already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Homepage update detected."
          fi

      - name: Publish automation branch and open or update PR
        id: pull_request
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PR_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          AUTOMATION_TOKEN_CONFIGURED: ${{ secrets.AUTOMATION_PR_TOKEN != '' }}
        run: |
          gh auth setup-git

          remote_sha="$(
            git ls-remote --heads origin "refs/heads/${AUTOMATION_BRANCH}" \
              | awk '{print $1}'
          )"

          git switch -c "$AUTOMATION_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "content: sync latest newsletter articles"

          if [[ -n "$remote_sha" ]]; then
            git push \
              --force-with-lease="refs/heads/${AUTOMATION_BRANCH}:${remote_sha}" \
              origin "HEAD:refs/heads/${AUTOMATION_BRANCH}"
          else
            git push --set-upstream origin "HEAD:refs/heads/${AUTOMATION_BRANCH}"
          fi

          cat > /tmp/newsletter-sync-pr.md <<EOF
          ## Resumo

          Atualiza automaticamente a homepage com os artigos mais recentes do catálogo da newsletter.

          ## Validação

          - bloco da newsletter renderizado por \`.github/scripts/render-newsletter.py\`;
          - quantidade de artigos validada antes do commit;
          - \`git diff --check\` executado;
          - quality gates do repositório devem passar antes do merge.

          ## Origem

          Gerado por [Sync newsletter articles](https://github.com/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}).

          > Este PR é mantido pela automação. Novas sincronizações atualizam a mesma branch enquanto o PR estiver aberto.
          EOF

          pr_number="$(
            gh pr list \
              --repo "$GH_REPO" \
              --head "$AUTOMATION_BRANCH" \
              --base main \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" \
              --repo "$GH_REPO" \
              --title "content: sync latest newsletter articles" \
              --body-file /tmp/newsletter-sync-pr.md
          else
            pr_number="$(
              gh pr create \
                --repo "$GH_REPO" \
                --base main \
                --head "$AUTOMATION_BRANCH" \
                --title "content: sync latest newsletter articles" \
                --body-file /tmp/newsletter-sync-pr.md \
                --json number \
                --jq '.number'
            )"
          fi

          pr_url="$(gh pr view "$pr_number" --repo "$GH_REPO" --json url --jq '.url')"

          echo "number=${pr_number}" >> "$GITHUB_OUTPUT"
          echo "url=${pr_url}" >> "$GITHUB_OUTPUT"
          echo "automation_token_configured=${AUTOMATION_TOKEN_CONFIGURED}" >> "$GITHUB_OUTPUT"

      - name: Write synchronization summary
        if: always()
        shell: bash
        env:
          ARTICLE_COUNT: ${{ steps.validation.outputs.article_count }}
          HOMEPAGE_CHANGED: ${{ steps.changes.outputs.changed }}
          PR_NUMBER: ${{ steps.pull_request.outputs.number }}
          PR_URL: ${{ steps.pull_request.outputs.url }}
          AUTOMATION_TOKEN_CONFIGURED: ${{ steps.pull_request.outputs.automation_token_configured }}
        run: |
          {
            echo "# Newsletter synchronization"
            echo
            echo "- **Artigos renderizados:** ${ARTICLE_COUNT:-n/a}"
            echo "- **Homepage alterada:** ${HOMEPAGE_CHANGED:-n/a}"

            if [[ -n "$PR_URL" ]]; then
              echo "- **Branch:** \`${AUTOMATION_BRANCH}\`"
              echo "- **Pull Request:** [#${PR_NUMBER}](${PR_URL})"

              if [[ "$AUTOMATION_TOKEN_CONFIGURED" == "true" ]]; then
                echo "- **Token de automação dedicado:** configurado"
              else
                echo "- **Token de automação dedicado:** não configurado; o GitHub pode exigir aprovação manual para iniciar os workflows do PR criado pelo \`GITHUB_TOKEN\`."
              fi
            else
              echo "- **Pull Request:** não necessário"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
