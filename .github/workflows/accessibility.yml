name: Accessibility

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accessibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accessibility:
    name: WCAG 2 AA accessibility
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Pa11y CI
        run: npm install --no-save --package-lock=false pa11y-ci@4.1.1

      - name: Validate contrast tokens
        run: node .github/scripts/check-contrast.mjs

      - name: Validate accessibility page discovery
        run: |
          node - <<'NODE'
          const config = require("./.pa11yci.cjs");
          const fs = require("node:fs");
          const path = require("node:path");
          const origin = "http://127.0.0.1:8080";
          const expected = new Set([`${origin}/`, `${origin}/en/`]);
          for (const root of ["case-studies", path.join("en", "case-studies")]) {
            for (const entry of fs.readdirSync(root, { withFileTypes: true })) {
              if (entry.isDirectory() && fs.existsSync(path.join(root, entry.name, "index.html"))) {
                expected.add(`${origin}/${root.split(path.sep).join("/")}/${entry.name}/`);
              }
            }
          }
          const actual = new Set(config.urls);
          const missing = [...expected].filter((url) => !actual.has(url));
          const unexpected = [...actual].filter((url) => !expected.has(url));
          if (actual.size !== config.urls.length || missing.length || unexpected.length) {
            throw new Error(`Accessibility URL drift. Missing: ${missing}; unexpected: ${unexpected}.`);
          }
          console.log(`Discovered ${config.urls.length} accessibility URLs.`);
          NODE

      - name: Prepare local accessibility fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pages = [Path("index.html"), Path("en/index.html")]
          pages.extend(sorted(Path("case-studies").glob("*/index.html")))
          pages.extend(sorted(Path("en/case-studies").glob("*/index.html")))
          for path in pages:
              content = path.read_text(encoding="utf-8")
              content = content.replace("; upgrade-insecure-requests", "")
              path.write_text(content, encoding="utf-8")
          PY

      - name: Start local site
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/portfolio-http.log 2>&1 &
          echo $! > /tmp/portfolio-http.pid

          for _ in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/portfolio-http.log
          exit 1

      - name: Run WCAG 2 AA checks
        run: npx --no-install pa11y-ci --config .pa11yci.cjs --threshold 0

      - name: Stop local site
        if: always()
        run: |
          if [[ -f /tmp/portfolio-http.pid ]]; then
            kill "$(cat /tmp/portfolio-http.pid)" 2>/dev/null || true
          fi
