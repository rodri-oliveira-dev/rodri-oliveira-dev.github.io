name: Accessibility

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accessibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accessibility:
    name: WCAG 2 AA accessibility
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Test impact selection
        run: node --test .github/scripts/test-select-accessibility-impact.cjs

      - name: Select accessibility audit scope
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/select-accessibility-impact.cjs

      - name: No accessibility impact (success)
        if: steps.plan.outputs.run == 'false'
        env:
          PLAN_REASON: ${{ steps.plan.outputs.reason }}
        run: |
          printf '## Accessibility workflow\n\n%s. Required check passed without a scan.\n' "$PLAN_REASON" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Pa11y CI
        if: steps.plan.outputs.run != 'false'
        run: npm install --ignore-scripts --no-save --package-lock=false pa11y-ci@4.1.1

      - name: Configure system Chrome for Pa11y
        if: steps.plan.outputs.run != 'false'
        shell: bash
        run: |
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || command -v chromium)"
          if [[ -z "$chrome_path" ]]; then
            echo "No system Chrome or Chromium executable was found."
            exit 1
          fi
          echo "PUPPETEER_EXECUTABLE_PATH=${chrome_path}" >> "$GITHUB_ENV"

      - name: Validate contrast tokens
        if: steps.plan.outputs.run != 'false'
        id: tokens
        run: node .github/scripts/check-contrast.mjs

      - name: Validate accessibility page discovery
        if: steps.plan.outputs.run != 'false'
        id: discovery
        run: |
          node - <<'NODE'
          const config = require("./.pa11yci.cjs");
          const fs = require("node:fs");
          const path = require("node:path");
          const origin = "http://127.0.0.1:8080";
          const languageRoots = ["", "en", "es"];
          const expected = new Set(languageRoots
            .map((root) => `${origin}/${root ? `${root}/` : ""}`));
          for (const root of languageRoots) {
            const route = path.join(root, "offline.html");
            if (!fs.existsSync(route)) throw new Error(`Missing offline page: ${route}`);
            expected.add(`${origin}/${route.split(path.sep).join("/")}`);
          }
          for (const route of ["curriculo/", "en/resume/", "es/curriculo/"]) {
            if (!fs.existsSync(`${route}index.html`)) throw new Error(`Missing resume page: ${route}`);
            expected.add(`${origin}/${route}`);
          }
          for (const route of ["servicos/", "en/services/", "es/servicios/"]) {
            if (!fs.existsSync(`${route}index.html`)) throw new Error(`Missing service page: ${route}`);
            expected.add(`${origin}/${route}`);
          }
          for (const root of languageRoots.map((language) => path.join(language, "case-studies"))) {
            if (!fs.existsSync(root)) continue;
            for (const entry of fs.readdirSync(root, { withFileTypes: true })) {
              if (entry.isDirectory() && fs.existsSync(path.join(root, entry.name, "index.html"))) {
                expected.add(`${origin}/${root.split(path.sep).join("/")}/${entry.name}/`);
              }
            }
          }
          const actual = new Set(config.urls);
          const missing = [...expected].filter((url) => !actual.has(url));
          const unexpected = [...actual].filter((url) => !expected.has(url));
          if (actual.size !== config.urls.length || missing.length || unexpected.length) {
            throw new Error(`Accessibility URL drift. Missing: ${missing}; unexpected: ${unexpected}.`);
          }
          console.log(`Discovered ${config.urls.length} accessibility URLs.`);
          NODE

      - name: Prepare local accessibility fixture
        if: steps.plan.outputs.run != 'false'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pages = [Path("index.html"), Path("en/index.html"), Path("es/index.html"), Path("curriculo/index.html"), Path("en/resume/index.html"), Path("es/curriculo/index.html"), Path("servicos/index.html"), Path("en/services/index.html"), Path("es/servicios/index.html")]
          for root in (Path("case-studies"), Path("en/case-studies"), Path("es/case-studies")):
              pages.extend(sorted(root.glob("*/index.html")))
          for path in pages:
              content = path.read_text(encoding="utf-8")
              content = content.replace("; upgrade-insecure-requests", "")
              path.write_text(content, encoding="utf-8")
          PY

      - name: Start local site
        if: steps.plan.outputs.run != 'false'
        id: site
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/portfolio-http.log 2>&1 &
          echo $! > /tmp/portfolio-http.pid

          for _ in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/portfolio-http.log
          exit 1

      - name: Run WCAG 2 AA checks
        if: steps.plan.outputs.run != 'false'
        id: pa11y
        run: npx --no-install pa11y-ci --config .pa11yci.cjs --threshold 0

      - name: Diagnose rendered contrast on Pa11y failure
        id: diagnosis
        if: ${{ !cancelled() && steps.plan.outputs.run != 'false' && steps.pa11y.outcome == 'failure' }}
        run: node .github/scripts/diagnose-rendered-contrast.cjs

      - name: Validate responsive layout and keyboard navigation
        id: responsive
        if: ${{ !cancelled() && steps.plan.outputs.run != 'false' && steps.site.outcome == 'success' }}
        run: node .github/scripts/test-responsive.cjs

      - name: Validate text adaptations and accessibility tree
        id: adaptations
        if: ${{ !cancelled() && steps.plan.outputs.run != 'false' && steps.site.outcome == 'success' }}
        run: node .github/scripts/test-accessibility-adaptations.cjs

      - name: Validate contrast preferences
        id: preferences
        if: ${{ !cancelled() && steps.plan.outputs.run != 'false' && steps.site.outcome == 'success' }}
        run: node .github/scripts/test-contrast-preference.cjs

      - name: Summarize accessibility workflow
        if: ${{ always() && steps.plan.outputs.run != 'false' }}
        env:
          TOKENS: ${{ steps.tokens.outcome }}
          DISCOVERY: ${{ steps.discovery.outcome }}
          SITE: ${{ steps.site.outcome }}
          PA11Y: ${{ steps.pa11y.outcome }}
          DIAGNOSIS: ${{ steps.diagnosis.outcome }}
          RESPONSIVE: ${{ steps.responsive.outcome }}
          ADAPTATIONS: ${{ steps.adaptations.outcome }}
          PREFERENCES: ${{ steps.preferences.outcome }}
        run: |
          {
            echo '## Accessibility workflow'
            echo '| Suite | Result |'
            echo '| --- | --- |'
            printf '| Contrast tokens | %s |\n' "${TOKENS:-not run}"
            printf '| URL discovery | %s |\n' "${DISCOVERY:-not run}"
            printf '| Local site | %s |\n' "${SITE:-not run}"
            printf '| Pa11y / axe | %s |\n' "${PA11Y:-not run}"
            printf '| Contrast diagnostics | %s |\n' "${DIAGNOSIS:-not run}"
            printf '| Responsive and keyboard | %s |\n' "${RESPONSIVE:-not run}"
            printf '| Text adaptations and AX tree | %s |\n' "${ADAPTATIONS:-not run}"
            printf '| Contrast preferences | %s |\n' "${PREFERENCES:-not run}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop local site
        if: ${{ always() && steps.plan.outputs.run != 'false' }}
        run: |
          if [[ -f /tmp/portfolio-http.pid ]]; then
            kill "$(cat /tmp/portfolio-http.pid)" 2>/dev/null || true
          fi
