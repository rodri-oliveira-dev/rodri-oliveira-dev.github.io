name: Terraform validation

run-name: >-
  Terraform ${{ github.event_name == 'workflow_dispatch' && inputs.operation || 'validate' }}
  on ${{ github.ref_name }}

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run on main
        required: true
        default: validate
        type: choice
        options:
          - validate
          - validate-oidc
          - plan
          - apply
      apply_confirmation:
        description: Type APPLY only after reviewing the protected Environment and change window
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_VERSION: "1.17.2"

jobs:
  validate:
    name: Terraform fmt and validate
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive infra/terraform

      - name: Verify signed cross-platform provider lockfiles
        shell: bash
        run: |
          set -euo pipefail

          for directory in infra/terraform infra/terraform/identity-reconciliation; do
            terraform -chdir="$directory" providers lock \
              -platform=linux_amd64 \
              -platform=windows_amd64 \
              -platform=darwin_amd64 \
              -platform=darwin_arm64
          done

          git diff --exit-code -- \
            infra/terraform/.terraform.lock.hcl \
            infra/terraform/identity-reconciliation/.terraform.lock.hcl

      - name: Initialize and validate without remote backend
        shell: bash
        run: |
          set -euo pipefail

          for directory in infra/terraform infra/terraform/identity-reconciliation; do
            terraform -chdir="$directory" init \
              -backend=false \
              -input=false \
              -lockfile=readonly \
              -no-color
            terraform -chdir="$directory" validate -no-color
          done

      - name: Run credential-free Terraform unit tests
        run: terraform -chdir=infra/terraform test -test-directory=tests -no-color

  reject_untrusted_dispatch:
    name: Reject untrusted Terraform dispatch
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.operation != 'validate' &&
      github.ref != 'refs/heads/main'
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    timeout-minutes: 2

    steps:
      - name: Reject authenticated operation outside main
        run: |
          echo "Authenticated Terraform operations are allowed only from refs/heads/main."
          exit 1

  reject_unconfirmed_apply:
    name: Require explicit apply confirmation
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'apply' &&
      inputs.apply_confirmation != 'APPLY'
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    timeout-minutes: 2

    steps:
      - name: Reject apply without exact confirmation
        run: |
          echo "Apply requires the exact confirmation APPLY."
          exit 1

  validate_oidc:
    name: Validate Terraform Environment OIDC
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.operation == 'validate-oidc'
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    timeout-minutes: 5
    environment: terraform-dev

    permissions:
      contents: read
      id-token: write

    env:
      AZURE_CORE_OUTPUT: none

    steps:
      - name: Authenticate with Azure using Environment OIDC
        uses: azure/login@8c334a195cbb38e46038007b304988d888bf676a
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify read access to the existing Resource Group
        shell: bash
        run: |
          set -euo pipefail
          az group show --name rg-portfolio-push-dev --output none
          echo "Environment OIDC authentication and Resource Group read access succeeded. No Terraform State or Azure resources were modified." >> "$GITHUB_STEP_SUMMARY"

  plan:
    name: Terraform plan (protected)
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.operation == 'plan'
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    timeout-minutes: 20
    environment: terraform-dev

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        shell: bash
        working-directory: infra/terraform

    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_USE_CLI: "false"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_tenant_id: ${{ vars.AZURE_TENANT_ID }}

    steps:
      - name: Checkout trusted main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: main

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Authenticate with Azure using Environment OIDC
        uses: azure/login@8c334a195cbb38e46038007b304988d888bf676a
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Initialize remote backend
        run: terraform init -backend-config=backend.hcl.example -input=false -lockfile=readonly -no-color

      - name: Create ephemeral plan without publishing its contents
        run: |
          set -euo pipefail

          plan_file="${RUNNER_TEMP}/portfolio-push.tfplan"
          plan_log="${RUNNER_TEMP}/portfolio-push-plan.log"
          trap 'rm -f "$plan_file" "$plan_log"' EXIT

          set +e
          terraform plan \
            -detailed-exitcode \
            -input=false \
            -lock-timeout=5m \
            -no-color \
            -out="$plan_file" > "$plan_log" 2>&1
          plan_status=$?
          set -e

          case "$plan_status" in
            0)
              echo "Terraform plan completed successfully with no changes." >> "$GITHUB_STEP_SUMMARY"
              ;;
            2)
              echo "Terraform plan completed successfully with pending changes. Review them in a trusted operator session; this workflow does not publish the plan." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "Terraform plan failed. The potentially sensitive plan log was not published." >&2
              exit "$plan_status"
              ;;
          esac

  apply:
    name: Terraform apply (human approval required)
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.operation == 'apply' &&
      inputs.apply_confirmation == 'APPLY'
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    timeout-minutes: 30
    environment: terraform-dev

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        shell: bash
        working-directory: infra/terraform

    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_USE_CLI: "false"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_tenant_id: ${{ vars.AZURE_TENANT_ID }}

    steps:
      - name: Checkout trusted main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: main

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Authenticate with Azure using Environment OIDC
        uses: azure/login@8c334a195cbb38e46038007b304988d888bf676a
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Initialize remote backend
        run: terraform init -backend-config=backend.hcl.example -input=false -lockfile=readonly -no-color

      - name: Plan and apply the approved revision
        run: |
          set -euo pipefail

          plan_file="${RUNNER_TEMP}/portfolio-push.tfplan"
          plan_log="${RUNNER_TEMP}/portfolio-push-plan.log"
          apply_log="${RUNNER_TEMP}/portfolio-push-apply.log"
          trap 'rm -f "$plan_file" "$plan_log" "$apply_log"' EXIT

          if ! terraform plan \
            -input=false \
            -lock-timeout=5m \
            -no-color \
            -out="$plan_file" > "$plan_log" 2>&1; then
            echo "Terraform plan failed. The potentially sensitive plan log was not published." >&2
            exit 1
          fi

          if ! terraform apply \
            -auto-approve \
            -input=false \
            -lock-timeout=5m \
            -no-color \
            "$plan_file" > "$apply_log" 2>&1; then
            echo "Terraform apply failed. The potentially sensitive apply log was not published; inspect Azure and State in an authorized operator session." >&2
            exit 1
          fi

          echo "Terraform applied the ephemeral plan after protected Environment approval. No plan or State artifact was published." >> "$GITHUB_STEP_SUMMARY"
