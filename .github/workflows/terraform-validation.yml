name: Terraform validation

run-name: >-
  Terraform ${{ github.event_name == 'workflow_dispatch' && inputs.operation || 'validate' }}
  on ${{ github.ref_name }}

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run on main
        required: true
        default: validate
        type: choice
        options:
          - validate
          - validate-oidc
          - plan
          - diagnose-fingerprint
          - plan-foundation

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch' && inputs.operation != 'validate'
      && format('production-release-{0}', github.repository)
      || format('terraform-ci-{0}-{1}', github.repository, github.ref) }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_VERSION: "1.17.2"

jobs:
  validate:
    name: Terraform fmt and validate
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive infra/terraform

      - name: Verify signed cross-platform provider lockfiles
        shell: bash
        run: |
          set -euo pipefail

          for directory in infra/terraform infra/terraform/identity-reconciliation infra/terraform/runtime-iam infra/terraform/diagnostics infra/terraform/notification-iam; do
            terraform -chdir="$directory" providers lock \
              -platform=linux_amd64 \
              -platform=windows_amd64 \
              -platform=darwin_amd64 \
              -platform=darwin_arm64
          done

          git diff --exit-code -- \
            infra/terraform/.terraform.lock.hcl \
            infra/terraform/identity-reconciliation/.terraform.lock.hcl \
            infra/terraform/runtime-iam/.terraform.lock.hcl \
            infra/terraform/diagnostics/.terraform.lock.hcl \
            infra/terraform/notification-iam/.terraform.lock.hcl

      - name: Initialize and validate without remote backend
        shell: bash
        run: |
          set -euo pipefail

          for directory in infra/terraform infra/terraform/identity-reconciliation infra/terraform/runtime-iam infra/terraform/diagnostics infra/terraform/notification-iam; do
            terraform -chdir="$directory" init \
              -backend=false \
              -input=false \
              -lockfile=readonly \
              -no-color
            terraform -chdir="$directory" validate -no-color
          done

      - name: Test sanitized Terraform plan diagnostics
        run: python3 .github/scripts/test_terraform_plan_diagnostics.py

      - name: Test release fingerprint and sanitized comparison
        run: |
          python3 .github/scripts/test_terraform_release_plan.py
          python3 .github/scripts/test_terraform_fingerprint_diagnostics.py
          python3 .github/scripts/test_terraform_foundation_diagnostics.py

      - name: Run credential-free Terraform unit tests
        run: |
          terraform -chdir=infra/terraform test -test-directory=tests -no-color
          terraform -chdir=infra/terraform/diagnostics test -test-directory=tests -no-color
          terraform -chdir=infra/terraform/notification-iam test -test-directory=tests -no-color
          python3 .github/scripts/test_verify_diagnostics.py
          python3 .github/scripts/test_diagnostics_rbac.py
          python3 .github/scripts/test_verify_state_isolation.py
          python3 .github/scripts/test_validate_state_isolation_configuration.py

  reject_untrusted_dispatch:
    name: Reject untrusted Terraform dispatch
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.operation != 'validate' &&
      github.ref != 'refs/heads/main'
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    timeout-minutes: 2

    steps:
      - name: Reject authenticated operation outside main
        run: |
          echo "Authenticated Terraform operations are allowed only from refs/heads/main."
          exit 1

  validate_oidc:
    name: Validate Terraform Environment OIDC
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.operation == 'validate-oidc'
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    timeout-minutes: 5
    environment: terraform-dev

    permissions:
      contents: read
      id-token: write

    env:
      AZURE_CORE_OUTPUT: none

    steps:
      - name: Authenticate with Azure using Environment OIDC
        uses: azure/login@8c334a195cbb38e46038007b304988d888bf676a
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify read access to the existing Resource Group
        shell: bash
        run: |
          set -euo pipefail
          az group show --name rg-portfolio-push-dev --output none
          az group show --name rg-portfolio-push-workload-dev --output none
          echo "Environment OIDC authentication and State and workload Resource Group read access succeeded. No Terraform State or Azure resources were modified." >> "$GITHUB_STEP_SUMMARY"

  plan:
    name: Terraform plan (protected)
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.operation == 'plan'
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    timeout-minutes: 20
    environment: terraform-dev

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        shell: bash
        working-directory: infra/terraform

    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_USE_CLI: "false"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_tenant_id: ${{ vars.AZURE_TENANT_ID }}

    steps:
      - name: Checkout trusted main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Authenticate with Azure using Environment OIDC
        uses: azure/login@8c334a195cbb38e46038007b304988d888bf676a
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Initialize remote backend
        run: terraform init -backend-config=backend.hcl.example -input=false -lockfile=readonly -no-color

      - name: Create ephemeral plan without publishing its contents
        run: |
          set -euo pipefail

          plan_file="${RUNNER_TEMP}/portfolio-push.tfplan"
          plan_log="${RUNNER_TEMP}/portfolio-push-plan.log"
          trap 'rm -f "$plan_file" "$plan_log"' EXIT

          set +e
          terraform plan \
            -json \
            -detailed-exitcode \
            -input=false \
            -lock-timeout=5m \
            -no-color \
            -out="$plan_file" > "$plan_log" 2>&1
          plan_status=$?
          set -e

          case "$plan_status" in
            0)
              echo "Terraform plan completed successfully with no changes." >> "$GITHUB_STEP_SUMMARY"
              ;;
            2)
              echo "Terraform plan completed successfully with pending changes. Review them in a trusted operator session; this workflow does not publish the plan." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "Terraform plan failed. The potentially sensitive plan log was not published." >&2
              if ! python3 ../../.github/scripts/terraform-plan-diagnostics.py "$plan_log" \
                --exit-code "$plan_status" --summary "$GITHUB_STEP_SUMMARY" 2>/dev/null; then
                echo "Safe diagnostic extraction failed; raw output withheld." >&2
              fi
              exit "$plan_status"
              ;;
          esac

  diagnose_fingerprint:
    name: Diagnose foundation plan fingerprint (protected)
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.operation == 'diagnose-fingerprint'
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    timeout-minutes: 30
    environment: terraform-dev
    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        shell: bash
        working-directory: infra/terraform

    env:
      ARM_USE_OIDC: 'true'
      ARM_USE_AZUREAD: 'true'
      ARM_USE_CLI: 'false'
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      TF_VAR_create_function_app: 'false'

    steps:
      - name: Checkout immutable main candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Authenticate with the release Environment identity
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Compare two independent ephemeral foundation plans
        run: |
          set -euo pipefail
          umask 077
          scratch="$(mktemp -d "$RUNNER_TEMP/terraform-fingerprint.XXXXXX")"
          trap 'rm -rf -- "$scratch"' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          if ! terraform init -backend-config=backend.hcl.example -input=false -lockfile=readonly -no-color >"$scratch/init.log" 2>&1; then
            echo 'Terraform diagnostic initialization failed; raw output withheld.' >&2
            exit 1
          fi
          for index in first second; do
            if ! terraform plan -input=false -lock-timeout=5m -no-color -out="$scratch/$index.tfplan" >"$scratch/$index.log" 2>&1; then
              echo 'Terraform diagnostic plan failed; raw output withheld.' >&2
              exit 1
            fi
            if ! terraform show -json "$scratch/$index.tfplan" >"$scratch/$index.json" 2>"$scratch/$index-show.log"; then
              echo 'Terraform diagnostic plan conversion failed; raw output withheld.' >&2
              exit 1
            fi
          done
          if ! python3 ../../.github/scripts/terraform-fingerprint-diagnostics.py "$scratch/first.json" "$scratch/second.json" --summary "$GITHUB_STEP_SUMMARY" >"$scratch/comparison.log" 2>&1; then
            echo 'Terraform fingerprint comparison failed; raw output withheld.' >&2
            exit 1
          fi

  plan_foundation:
    name: Plan foundation only (protected)
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.operation == 'plan-foundation'
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    timeout-minutes: 20
    environment: terraform-dev
    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        shell: bash
        working-directory: infra/terraform

    env:
      ARM_USE_OIDC: 'true'
      ARM_USE_AZUREAD: 'true'
      ARM_USE_CLI: 'false'
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      TF_VAR_create_function_app: 'false'

    steps:
      - name: Checkout immutable main candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Authenticate with the release Environment identity
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Generate sanitized foundation plan report
        run: |
          set -euo pipefail
          umask 077
          scratch="$(mktemp -d "$RUNNER_TEMP/terraform-foundation.XXXXXX")"
          trap 'rm -rf -- "$scratch"' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          if ! terraform init -backend-config=backend.hcl.example -input=false -lockfile=readonly -no-color >"$scratch/init.log" 2>&1; then
            echo 'Terraform foundation initialization failed; raw output withheld.' >&2
            exit 1
          fi
          status=0
          terraform plan -json -detailed-exitcode -input=false -lock-timeout=5m -no-color -out="$scratch/plan.tfplan" >"$scratch/plan.log" 2>&1 || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            if ! python3 ../../.github/scripts/terraform-plan-diagnostics.py "$scratch/plan.log" --exit-code "$status" --summary "$GITHUB_STEP_SUMMARY" 2>/dev/null; then
              echo 'Safe foundation diagnostic extraction failed; raw output withheld.' >&2
            fi
            exit "$status"
          fi
          if ! terraform show -json "$scratch/plan.tfplan" >"$scratch/plan.json" 2>"$scratch/show.log"; then
            echo 'Terraform foundation plan conversion failed; raw output withheld.' >&2
            exit 1
          fi
          if ! python3 ../../.github/scripts/terraform-foundation-diagnostics.py "$scratch/plan.json" --summary "$GITHUB_STEP_SUMMARY" 2>"$scratch/report.log"; then
            echo 'Safe foundation report failed; raw output withheld.' >&2
            exit 1
          fi
