name: Optimize Open Graph image

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/optimize-og-image.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate optimized WebP
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path("assets/social/rodrigo-de-oliveira-og.png")
          target = Path("assets/social/rodrigo-de-oliveira-og.webp")

          with Image.open(source) as image:
              original_size = image.size
              image.convert("RGB").save(target, "WEBP", quality=80, method=6)

          with Image.open(target) as optimized:
              if optimized.size != original_size:
                  raise SystemExit(
                      f"Unexpected dimension change: {original_size} -> {optimized.size}"
                  )

          size = target.stat().st_size
          print(f"Optimized WebP: {size} bytes, dimensions preserved: {original_size}")

          if size >= 300 * 1024:
              raise SystemExit(f"Optimized image is still too large: {size} bytes")
          PY

      - name: Commit optimized asset
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/social/rodrigo-de-oliveira-og.webp
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "perf: add optimized Open Graph WebP image"
          git push
