name: Apply head metadata

on:
  push:
    branches:
      - feat/mobile
    paths:
      - .github/workflows/apply-head-meta.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feat/mobile
        uses: actions/checkout@v4
        with:
          ref: feat/mobile
          fetch-depth: 0

      - name: Apply metadata
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          for path in (Path('index.html'), Path('en/index.html')):
              text = path.read_text(encoding='utf-8')

              author = '  <meta name="author" content="Rodrigo de Oliveira">'
              color_scheme = '  <meta name="color-scheme" content="dark">'
              if color_scheme not in text:
                  if author not in text:
                      raise SystemExit(f'author meta not found in {path}')
                  text = text.replace(author, author + '\n' + color_scheme, 1)

              old_robots = '  <meta name="robots" content="index,follow">'
              new_robots = '  <meta name="robots" content="index,follow,max-image-preview:large">'
              if old_robots in text:
                  text = text.replace(old_robots, new_robots, 1)
              elif new_robots not in text:
                  raise SystemExit(f'robots meta not found in {path}')

              path.write_text(text, encoding='utf-8')
          PY

          git rm .github/workflows/apply-head-meta.yml

      - name: Commit metadata updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: refine head metadata" || exit 0
          git push origin HEAD:feat/mobile
