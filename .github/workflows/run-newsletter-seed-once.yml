name: Run newsletter seed once

on:
  push:
    paths:
      - ".github/workflows/run-newsletter-seed-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest

    steps:
      - name: Dispatch five newsletter metadata runs sequentially
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          urls=(
            "https://pt.linkedin.com/pulse/entities-e-value-objects-identidade-igualdade-modelo-de-de-oliveira-hy4gf"
            "https://pt.linkedin.com/pulse/context-map-como-bounded-contexts-se-relacionam-sem-seus-de-oliveira-vhowf"
            "https://pt.linkedin.com/pulse/bounded-context-onde-um-modelo-e-uma-linguagem-rodrigo-de-oliveira-ltrjf"
            "https://pt.linkedin.com/pulse/domain-subdomain-e-core-onde-se-deve-realmente-tempo-em-de-oliveira-41taf"
            "https://pt.linkedin.com/pulse/linguagem-ub%C3%ADqua-como-transformar-conhecimento-do-em-de-oliveira-i1vjf"
          )

          for url in "${urls[@]}"; do
            previous_id="$(gh run list               --workflow test-newsletter-metadata.yml               --event workflow_dispatch               --limit 1               --json databaseId               --jq '.[0].databaseId // 0')"

            echo "Dispatching: $url"
            gh workflow run test-newsletter-metadata.yml               --ref main               -f article_url="$url"

            run_id=""
            for attempt in {1..30}; do
              candidate="$(gh run list                 --workflow test-newsletter-metadata.yml                 --event workflow_dispatch                 --limit 1                 --json databaseId                 --jq '.[0].databaseId // 0')"

              if [ "$candidate" != "0" ] && [ "$candidate" != "$previous_id" ]; then
                run_id="$candidate"
                break
              fi

              sleep 2
            done

            if [ -z "$run_id" ]; then
              echo "Could not identify dispatched workflow run." >&2
              exit 1
            fi

            echo "Waiting for run $run_id"
            gh run watch "$run_id" --exit-status
          done
