name: SEO validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seo-validation:
    name: SEO metadata consistency
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test deterministic SEO synchronization
        run: python3 -m unittest discover -s .github/scripts -p 'test_sync_seo.py'

      - name: Regenerate SEO artifacts
        run: python3 .github/scripts/sync-seo.py

      - name: Validate generated files are committed
        shell: bash
        run: |
          git diff --check

          if ! git diff --quiet -- index.html en/index.html es/index.html curriculo/index.html en/resume/index.html es/curriculo/index.html case-studies en/case-studies es/case-studies servicos en/services es/servicios sitemap.xml; then
            echo "SEO artifacts are out of sync. Run: python3 .github/scripts/sync-seo.py"
            git diff -- index.html en/index.html es/index.html curriculo/index.html en/resume/index.html es/curriculo/index.html case-studies en/case-studies es/case-studies servicos en/services es/servicios sitemap.xml
            exit 1
          fi

      - name: Validate structured data and sitemap
        run: |
          python3 - <<'PY'
          import json
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          home_pages = [Path("index.html"), Path("en/index.html"), Path("es/index.html")]
          for path in home_pages:
              if not path.is_file():
                  raise SystemExit(f"Required localized homepage missing: {path}")
              page = path.as_posix()
              html = Path(page).read_text(encoding="utf-8")
              if 'type="application/rss+xml"' not in html:
                  raise SystemExit(f"RSS autodiscovery missing in {page}")
              if page == "es/index.html" and "https://rodri-oliveira-dev.hashnode.dev/rss.xml" not in html:
                  raise SystemExit("Spanish RSS autodiscovery does not point to Hashnode")

              match = re.search(
                  r'<!-- SEO_STRUCTURED_DATA:START -->\s*<script type="application/ld\+json">\s*(\{.*?\})\s*</script>\s*<!-- SEO_STRUCTURED_DATA:END -->',
                  html,
                  re.DOTALL,
              )
              if not match:
                  raise SystemExit(f"SEO structured data block missing in {page}")

              payload = json.loads(match.group(1))
              graph = payload.get("@graph", [])
              types = {node.get("@type") for node in graph if isinstance(node, dict)}
              for required in ("WebSite", "ProfilePage", "Person"):
                  if required not in types:
                      raise SystemExit(f"{required} structured data missing in {page}")

          resume_pages = {
              "pt-BR": (Path("curriculo/index.html"), "https://rodri-oliveira-dev.github.io/curriculo/"),
              "en": (Path("en/resume/index.html"), "https://rodri-oliveira-dev.github.io/en/resume/"),
              "es-419": (Path("es/curriculo/index.html"), "https://rodri-oliveira-dev.github.io/es/curriculo/"),
          }
          expected_resume_alternates = {
              "pt-BR": resume_pages["pt-BR"][1], "en": resume_pages["en"][1],
              "es": resume_pages["es-419"][1], "x-default": resume_pages["pt-BR"][1],
          }
          for language, (path, resume_url) in resume_pages.items():
              resume_html = path.read_text(encoding="utf-8")
              required_fragments = (
                  f'<html lang="{language}">', '<meta name="robots" content="index,follow,max-image-preview:large">',
                  f'<link rel="canonical" href="{resume_url}">', '<meta property="og:title"',
                  f'<meta property="og:url" content="{resume_url}">', '<meta property="og:image"',
                  '<meta name="twitter:card" content="summary_large_image">', '<meta name="twitter:image"',
              )
              if any(fragment not in resume_html for fragment in required_fragments):
                  raise SystemExit(f"Resume without required SEO metadata: {path}")
              alternates = dict(re.findall(r'<link rel="alternate" hreflang="([^"]+)" href="([^"]+)">', resume_html))
              if alternates != expected_resume_alternates:
                  raise SystemExit(f"Invalid resume hreflang: {path}")
              resume_match = re.search(r'<script type="application/ld\+json">\s*(\{.*?\})\s*</script>', resume_html, re.DOTALL)
              resume_graph = json.loads(resume_match.group(1)).get("@graph", []) if resume_match else []
              resume_types = {node.get("@type") for node in resume_graph}
              if not {"ProfilePage", "Person", "BreadcrumbList"} <= resume_types:
                  raise SystemExit(f"Incomplete resume structured data: {path}")
              profile = next(node for node in resume_graph if node.get("@type") == "ProfilePage")
              person = next(node for node in resume_graph if node.get("@type") == "Person")
              if (profile.get("url") != resume_url or profile.get("inLanguage") != language or
                      profile.get("mainEntity", {}).get("@id") != "https://rodri-oliveira-dev.github.io/#person" or
                      person.get("@id") != "https://rodri-oliveira-dev.github.io/#person" or person.get("name") != "Rodrigo de Oliveira"):
                  raise SystemExit(f"Inconsistent resume Person entity: {path}")


          # Service pages reuse the canonical Person/WebSite graph and must
          # reciprocate all language alternates before being indexed.
          service_pages = {
              "pt-BR": Path("servicos/index.html"),
              "en": Path("en/services/index.html"),
              "es-419": Path("es/servicios/index.html"),
          }
          service_urls = {
              "pt-BR": "https://rodri-oliveira-dev.github.io/servicos/",
              "en": "https://rodri-oliveira-dev.github.io/en/services/",
              "es-419": "https://rodri-oliveira-dev.github.io/es/servicios/",
          }
          expected_service_alternates = {
              "pt-BR": service_urls["pt-BR"],
              "en": service_urls["en"],
              "es": service_urls["es-419"],
              "x-default": service_urls["pt-BR"],
          }
          for language, path in service_pages.items():
              if not path.is_file():
                  raise SystemExit(f"Services translation missing: {path}")
              html = path.read_text(encoding="utf-8")
              url = service_urls[language]
              if f'<html lang="{language}">' not in html:
                  raise SystemExit(f"Incorrect service-page language: {path}")
              if f'<link rel="canonical" href="{url}">' not in html:
                  raise SystemExit(f"Incorrect service-page canonical: {path}")
              alternates = dict(re.findall(
                  r'<link rel="alternate" hreflang="([^"]+)" href="([^"]+)">',
                  html,
              ))
              if alternates != expected_service_alternates:
                  raise SystemExit(f"Service-page hreflang mismatch: {path}")

              match = re.search(
                  r'<!-- SEO_SERVICES_STRUCTURED_DATA:START -->\s*'
                  r'<script type="application/ld\+json">\s*(\{.*?\})\s*</script>\s*'
                  r'<!-- SEO_SERVICES_STRUCTURED_DATA:END -->',
                  html, re.DOTALL,
              )
              if not match:
                  raise SystemExit(f"Services JSON-LD missing: {path}")
              graph = json.loads(match.group(1)).get("@graph", [])
              types = {node.get("@type") for node in graph}
              if types != {"WebPage", "Service", "BreadcrumbList"}:
                  raise SystemExit(f"Unexpected services schema types: {path}")
              nodes = {node["@type"]: node for node in graph}
              page_node = nodes["WebPage"]
              service_node = nodes["Service"]
              breadcrumb = nodes["BreadcrumbList"]
              if (
                  page_node.get("@id") != f"{url}#webpage"
                  or page_node.get("url") != url
                  or page_node.get("inLanguage") != language
                  or page_node.get("isPartOf", {}).get("@id") !=
                     "https://rodri-oliveira-dev.github.io/#website"
                  or page_node.get("mainEntity", {}).get("@id") != f"{url}#service"
                  or service_node.get("@id") != f"{url}#service"
                  or service_node.get("provider", {}).get("@id") !=
                     "https://rodri-oliveira-dev.github.io/#person"
                  or service_node.get("mainEntityOfPage", {}).get("@id") !=
                     f"{url}#webpage"
                  or len(service_node.get("serviceType", [])) != 4
                  or breadcrumb.get("@id") != f"{url}#breadcrumb"
                  or [item.get("position") for item in
                      breadcrumb.get("itemListElement", [])] != [1, 2]
              ):
                  raise SystemExit(f"Inconsistent services JSON-LD entities: {path}")

          root = ET.parse("sitemap.xml").getroot()
          namespace = {
              "sm": "http://www.sitemaps.org/schemas/sitemap/0.9",
              "xhtml": "http://www.w3.org/1999/xhtml",
          }
          urls = root.findall("sm:url", namespace)
          expected_urls = {
              "https://rodri-oliveira-dev.github.io/",
              "https://rodri-oliveira-dev.github.io/en/",
              "https://rodri-oliveira-dev.github.io/es/",
              "https://rodri-oliveira-dev.github.io/curriculo/",
              "https://rodri-oliveira-dev.github.io/en/resume/",
              "https://rodri-oliveira-dev.github.io/es/curriculo/",
              "https://rodri-oliveira-dev.github.io/servicos/",
              "https://rodri-oliveira-dev.github.io/en/services/",
              "https://rodri-oliveira-dev.github.io/es/servicios/",
          }
          case_pages = sorted(Path("case-studies").glob("*/index.html"))
          english_pages = sorted(Path("en/case-studies").glob("*/index.html"))
          spanish_pages = sorted(Path("es/case-studies").glob("*/index.html"))
          pt_slugs = {page.parent.name for page in case_pages}
          en_slugs = {page.parent.name for page in english_pages}
          if pt_slugs != en_slugs:
              raise SystemExit("Case-study language pairs are incomplete")
          es_slugs = {page.parent.name for page in spanish_pages}
          if pt_slugs != en_slugs or pt_slugs != es_slugs:
              raise SystemExit("Case-study translations are incomplete")
          for slug in pt_slugs:
              expected_urls.add(f"https://rodri-oliveira-dev.github.io/case-studies/{slug}/")
              expected_urls.add(f"https://rodri-oliveira-dev.github.io/en/case-studies/{slug}/")
              expected_urls.add(f"https://rodri-oliveira-dev.github.io/es/case-studies/{slug}/")
          actual_urls = {
              (entry.findtext("sm:loc", namespaces=namespace) or "").strip()
              for entry in urls
          }
          if len(urls) != len(expected_urls) or actual_urls != expected_urls:
              raise SystemExit(f"Unexpected sitemap URLs: {sorted(actual_urls)}")
          for entry in urls:
              if not (entry.findtext("sm:lastmod", namespaces=namespace) or "").strip():
                  raise SystemExit("Sitemap URL without lastmod")
              loc = (entry.findtext("sm:loc", namespaces=namespace) or "").strip()
              if loc in {item[1] for item in resume_pages.values()}:
                  expected_sitemap_alternates = expected_resume_alternates
              elif loc in {
                  "https://rodri-oliveira-dev.github.io/servicos/",
                  "https://rodri-oliveira-dev.github.io/en/services/",
                  "https://rodri-oliveira-dev.github.io/es/servicios/",
              }:
                  expected_sitemap_alternates = {
                      "pt-BR": "https://rodri-oliveira-dev.github.io/servicos/",
                      "en": "https://rodri-oliveira-dev.github.io/en/services/",
                      "es": "https://rodri-oliveira-dev.github.io/es/servicios/",
                      "x-default": "https://rodri-oliveira-dev.github.io/servicos/",
                  }
              elif "/case-studies/" in loc:
                  slug = loc.rstrip("/").split("/")[-1]
                  expected_sitemap_alternates = {
                      "pt-BR": f"https://rodri-oliveira-dev.github.io/case-studies/{slug}/",
                      "en": f"https://rodri-oliveira-dev.github.io/en/case-studies/{slug}/",
                      "es": f"https://rodri-oliveira-dev.github.io/es/case-studies/{slug}/",
                      "x-default": f"https://rodri-oliveira-dev.github.io/case-studies/{slug}/",
                  }
              else:
                  expected_sitemap_alternates = {
                      "pt-BR": "https://rodri-oliveira-dev.github.io/",
                      "en": "https://rodri-oliveira-dev.github.io/en/",
                      "es": "https://rodri-oliveira-dev.github.io/es/",
                      "x-default": "https://rodri-oliveira-dev.github.io/",
                  }
              sitemap_alternates = {
                  link.attrib.get("hreflang", ""): link.attrib.get("href", "")
                  for link in entry.findall("xhtml:link", namespace)
              }
              if sitemap_alternates != expected_sitemap_alternates:
                  raise SystemExit(f"Invalid sitemap alternates for {loc}")

          for path in [*case_pages, *english_pages, *spanish_pages]:
              page = path.as_posix()
              html = path.read_text(encoding="utf-8")
              match = re.search(
                  r'<script type="application/ld\+json">\s*(\{.*?\})\s*</script>',
                  html,
                  re.DOTALL,
              )
              if not match:
                  raise SystemExit(f"Article structured data missing in {page}")
              payload = json.loads(match.group(1))
              article_types = payload.get("@type", [])
              if isinstance(article_types, str):
                  article_types = [article_types]
              for required_type in ("Article", "TechArticle"):
                  if required_type not in article_types:
                      raise SystemExit(
                          f"{required_type} structured data type missing in {page}"
                      )
              for required_field in (
                  "@id",
                  "headline",
                  "author",
                  "datePublished",
                  "dateModified",
                  "image",
              ):
                  if not payload.get(required_field):
                      raise SystemExit(
                          f"{required_field} structured data field missing in {page}"
                      )

              page_url = payload["url"]
              if payload["@id"] != f"{page_url}#article":
                  raise SystemExit(f"Invalid Article @id in {page}")
              author = payload["author"]
              if author.get("@id") != "https://rodri-oliveira-dev.github.io/#person":
                  raise SystemExit(f"Case study does not reuse canonical Person @id in {page}")
              if author.get("url") != "https://rodri-oliveira-dev.github.io/":
                  raise SystemExit(f"Case-study author profile URL is invalid in {page}")
              website = payload.get("isPartOf", {})
              if website.get("@id") != "https://rodri-oliveira-dev.github.io/#website":
                  raise SystemExit(f"Case study does not reuse canonical WebSite @id in {page}")
              main_page = payload.get("mainEntityOfPage", {})
              if main_page.get("@id") != page_url:
                  raise SystemExit(f"Invalid mainEntityOfPage in {page}")
              about = payload.get("about")
              if isinstance(about, dict):
                  repository = str(about.get("codeRepository") or "").rstrip("/")
                  if repository and about.get("@id") != f"{repository}#software-source-code":
                      raise SystemExit(f"Invalid SoftwareSourceCode @id in {page}")

              canonical = re.search(r'<link rel="canonical" href="([^"]+)">', html)
              alternates = dict(re.findall(
                  r'<link rel="alternate" hreflang="([^"]+)" href="([^"]+)">',
                  html,
              ))
              slug = path.parent.name
              expected_pt = f"https://rodri-oliveira-dev.github.io/case-studies/{slug}/"
              expected_en = f"https://rodri-oliveira-dev.github.io/en/case-studies/{slug}/"
              expected_es = f"https://rodri-oliveira-dev.github.io/es/case-studies/{slug}/"
              expected_self = (
                  expected_en if path.parts[0] == "en"
                  else expected_es if path.parts[0] == "es"
                  else expected_pt
              )
              if not canonical or canonical.group(1) != expected_self:
                  raise SystemExit(f"Invalid canonical in {page}")
              expected_alternates = {
                  "pt-BR": expected_pt,
                  "en": expected_en,
                  "x-default": expected_pt,
              }
              expected_alternates["es"] = expected_es
              if set(alternates) != set(expected_alternates):
                  raise SystemExit(f"Incomplete hreflang set in {page}")
              if alternates != expected_alternates:
                  raise SystemExit(f"Incorrect reciprocal hreflang values in {page}")
          PY
